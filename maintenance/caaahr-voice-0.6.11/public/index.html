<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikMnG · CAAAHR! Sesli Sürüş</title><link rel="stylesheet" href="/style.css"><script src="/vendor/lucide.js" defer></script><script src="/app.js" type="module"></script></head><body>
<header><div><strong>TikMnG</strong><span>CAAAHR! Sesli Sürüş</span></div><span id="game-state" class="status">Oyun bekleniyor</span></header>
<main><section class="connection"><div><h1>Yayın bağlantısı</h1><p id="connection-state" role="status">Bağlantı yok</p></div><form id="connect-form"><label class="sr-only" for="username">TikTok kullanıcı adı</label><input id="username" placeholder="TikTok kullanıcı adı" autocomplete="off" maxlength="32"><button type="submit"><i data-lucide="link"></i>Bağlan</button><button id="disconnect" type="button" class="quiet" title="Bağlantıyı kes" aria-label="Bağlantıyı kes"><i data-lucide="unplug"></i></button></form></section>
<nav><button data-tab="rules" aria-pressed="true"><i data-lucide="gift"></i>Hediyeler ve eylemler</button><button data-tab="voice" aria-pressed="false"><i data-lucide="mic"></i>Sesle sürüş</button><button data-tab="history" aria-pressed="false"><i data-lucide="list-checks"></i>Eylem geçmişi</button></nav>
<section id="rules" class="view"><div class="section-heading"><h2>Hediye kuralları</h2><div><span id="catalog-count"></span><button id="add-rule" class="quiet"><i data-lucide="plus"></i>Eylem ekle</button><button id="save"><i data-lucide="save"></i>Kaydet</button></div></div><div class="table-wrap"><table><thead><tr><th>Etkin</th><th>Hediye</th><th>Eylem</th><th>Ayar</th><th>Güç</th><th></th></tr></thead><tbody id="rule-rows"></tbody></table></div><div id="empty" class="empty">Henüz hediye kuralı yok.</div></section>
<section id="voice" class="view" hidden><div class="section-heading"><h2>Mikrofon ve sürüş</h2><button id="save-voice"><i data-lucide="save"></i>Kaydet</button></div><div class="voice-grid"><div><label class="toggle"><input id="enabled" type="checkbox">Sesle gaz verme</label><label>Mikrofon<select id="microphone"><option value="">Oyunda seçili mikrofon</option></select></label><label>Sessizlik eşiği <output id="noise-value"></output><input id="noise" type="range" min="-80" max="-10" step="1"></label><label>Tam gaz seviyesi <output id="full-value"></output><input id="full" type="range" min="-60" max="0" step="1"></label><label>Geçiş yumuşaklığı <output id="response-value"></output><input id="response" type="range" min="0.05" max="2" step="0.05"></label><label>Azami hız (m/s)<input id="max-speed" type="number" min="1" max="60" step="1"></label></div><div class="meter-panel"><h3>Canlı mikrofon</h3><strong id="db-value">— dB</strong><meter id="db-meter" min="-80" max="0" value="-80"></meter><h3>Gaz</h3><strong id="throttle-value">%0</strong><meter id="throttle-meter" min="0" max="1" value="0"></meter><div id="speed">0 km/sa</div><button id="calibrate" class="quiet"><i data-lucide="audio-lines"></i>Sessizliği ölç</button><span id="calibration-state" role="status"></span></div></div></section>
<section id="history" class="view" hidden><div class="section-heading"><h2>Eylem geçmişi</h2><span id="pending"></span></div><ul id="history-list"></ul></section>
</main><div id="toast" role="status" hidden></div><dialog id="catalog"><div class="catalog-header"><h2>Hediye kataloğu</h2><button id="close-catalog" class="quiet icon" title="Kapat" aria-label="Kapat"><i data-lucide="x"></i></button></div><input id="search" placeholder="Hediye adı veya kimliği" aria-label="Hediye ara"><div id="gift-grid"></div></dialog></body></html>
