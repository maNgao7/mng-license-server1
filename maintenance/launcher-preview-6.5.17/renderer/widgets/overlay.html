/* Broadcast surfaces: neutral glass, stable data columns, readable compact previews. */
:root{--pink:#f48b82;--gold:#edcc82;--ink:#f5f6f5;--panel:rgba(24,27,29,.9);--secondary:#bac2c3;--edge:rgba(255,255,255,.16)}
body{padding:12px}.stage{min-width:0;min-height:0}.stage *{letter-spacing:0}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:8px;box-shadow:0 5px 16px #0003;backdrop-filter:blur(8px)}
.eyebrow{font-size:10px;line-height:1.4;font-weight:700}.muted{color:var(--secondary)}
.avatar{flex:none;width:42px;height:42px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:#343c3e;color:#f5f6f5;font-size:17px;font-weight:700}
.stack{width:min(440px,100%);max-height:100%;min-height:0;gap:6px;overflow:hidden;align-content:start}
.item{grid-template-columns:42px minmax(0,1fr) auto;min-width:0;min-height:58px;padding:9px 12px;gap:10px}
.item>span:not(.avatar){min-width:0}.item b{font-size:14px;line-height:1.3;font-weight:650}.item small{font-size:11px;line-height:1.4;color:var(--secondary)}
.value{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rank .item{grid-template-columns:22px 42px minmax(0,1fr) auto}.rank .item:before{width:22px;height:22px;border-radius:4px;background:#363b3c;color:var(--secondary)}
.rank .item:first-child{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.leader-board{width:min(480px,100%);max-height:100%;gap:8px;padding:0;grid-template-rows:auto minmax(0,1fr)}
.leader-heading{padding:9px 12px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);color:var(--secondary);font-size:11px;font-weight:700;text-align:left;box-shadow:none}
.leader-list,.leader-list.unified{display:grid;max-height:none;min-height:0;overflow:hidden;gap:5px;align-content:start}
.leader-list.unified .item{grid-template-columns:22px 38px minmax(0,1fr) auto;min-height:56px;padding:8px 10px;border:1px solid var(--edge);border-left:2px solid var(--accent);background:var(--panel);box-shadow:none;gap:8px}
.leader-list.unified .item.champion{min-height:64px;border-color:color-mix(in srgb,var(--gold) 45%,transparent);border-left-color:var(--gold);background:rgba(39,36,29,.92);box-shadow:none}
.leader-list .place{width:22px;height:22px;background:#363b3c;color:var(--secondary);border-radius:4px;font-size:11px}
.leader-list .champion .place{background:var(--gold);color:#29251d}.leader-list.unified .avatar,.leader-list.unified .champion .avatar{width:38px;height:38px}
.hero{width:min(460px,100%);padding:18px;border-left:3px solid var(--accent)}
.hero-main{grid-template-columns:56px minmax(0,1fr) auto;gap:12px}.hero-main>span:not(.avatar){min-width:0}.hero .avatar{width:56px;height:56px}
.hero h1{margin:5px 0;font-size:20px;line-height:1.25;overflow-wrap:anywhere}.hero .muted{display:block;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.hero-score{font-size:23px;white-space:nowrap}
.viewer{max-width:100%;padding:18px 22px;gap:16px;border-left:3px solid var(--accent)}
.viewer .eye{width:42px;height:42px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:23px}
.viewer b{font-size:38px;line-height:1.15;font-weight:750;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.viewer small{display:block;margin-top:4px;font-size:12px;color:var(--secondary)}
.timer{min-width:0;max-width:100%;padding:17px 24px;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 5px 16px #0003}
.timer small{font-size:10px;margin-bottom:8px}.timer b{font-size:42px;line-height:1.2;text-shadow:none;font-weight:700}
.ticker{padding:12px 0;border-radius:6px;border:1px solid var(--edge);border-left:3px solid var(--accent);background:var(--panel)}
.ticker span{font-size:13px;font-weight:600;white-space:nowrap;flex:none}.ticker .avatar{flex:none;border-width:1px}.ticker-track{gap:30px}
.flip-award{width:min(340px,100%);height:auto;max-height:100%;padding:18px;gap:12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-top:3px solid var(--gold);background:var(--panel);box-shadow:0 5px 16px #0003}
.flip-award:before,.flip-award:after{display:none}.viral-kicker{max-width:100%;width:auto;padding:0;border:0;border-radius:0;background:none;color:var(--gold);font-size:11px;font-weight:700;box-shadow:none}
.flip-scene{width:180px;height:188px}.profile-face .avatar{width:142px!important;height:142px!important;border:2px solid var(--gold)}
.flip-face{gap:9px;text-shadow:none}.flip-face b{font-size:13px}.gift-face .gift-img{width:140px;height:140px}.flip-coins{font-size:25px;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:none}
.wheel{--diameter:min(300px,calc(100vw - 54px),calc(100vh - 110px));width:var(--diameter);height:var(--diameter);border:6px solid #d4d9d6;box-shadow:0 8px 22px #0004;flex:none}
.wheel:after{inset:36%;border:3px solid #d4d9d6;background:#202627;font-size:12px;font-weight:750}
.wheel-label{width:30%;font-size:12px;line-height:1.3;font-weight:750;color:#202627;text-shadow:none;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(var(--diameter) * -.34)) rotate(calc(-1 * var(--angle)))}

.physics-jar{width:min(300px,calc(100vw - 60px),calc((100vh - 114px)*.833));margin-top:32px;margin-bottom:32px;border-color:#d7e4df9c;background:linear-gradient(100deg,#f4fff414,transparent 22% 76%,#f4fff426);box-shadow:inset 8px 0 16px #fff2,inset -8px 0 14px #fff1,0 10px 18px #0003}
.physics-jar::before{border-color:#d7e4df9c;background:repeating-linear-gradient(0deg,#fff3 0 2px,#d4e2da12 3px 7px)}
.physics-jar-cap{border-color:#e4ebe5bf;background:#242b2780;box-shadow:0 3px 0 #d7e4df66,inset 0 2px 4px #0007}
.physics-jar-total{max-width:calc(100vw - 24px);padding:6px 12px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);font-size:12px;color:var(--gold);white-space:nowrap;text-shadow:none}
.physics-jar-glass{background:linear-gradient(96deg,transparent 8%,#fff3 11%,transparent 18% 82%,#fff3 88%,transparent 94%);border-bottom:3px solid #e3efe755}
.animal-buddies{width:100%;max-height:100%;display:flex;flex-wrap:wrap;gap:16px 12px;align-content:center;align-items:end}
.animal-buddy{min-width:0;flex:0 1 90px;gap:5px}.animal-buddy b{width:100%;max-width:100%;padding:4px;border-radius:4px;background:var(--panel);font-size:10px;white-space:nowrap;text-align:center;text-shadow:none}
.buddy-animal{font-size:50px}.animal-buddy .avatar{width:42px!important;height:42px!important}
.goal{width:min(460px,100%);padding:18px}.goal-head{gap:12px;align-items:center;flex-wrap:wrap}.goal h2{font-size:19px;line-height:1.3;margin:5px 0}.goal-head>strong{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}.bar{height:12px;padding:2px;margin-top:14px;background:#383e3d;border:0}.bar>i{background:var(--accent);box-shadow:none;max-width:100%}
.coin{box-shadow:0 2px 5px #0004;border-color:#f5e0a3;background:var(--gold);color:#655026;font-size:14px}
.heart{text-shadow:0 2px 7px #0003;font-style:normal}
.social{max-width:100%;background:var(--panel)}.social>span:last-child{min-width:0}.social b{display:block;overflow-wrap:anywhere;font-size:17px}.social .mark{background:var(--accent);color:#202627}

 }
 if(type==='commandinfo'){const cmd=chats.find(x=>String(x.message||'').startsWith('!'))||latest;stage.innerHTML=`<div class="alert glass">${avatar(cmd)}<span><span class="eyebrow">KOMUT SONUCU</span><h2>${esc(cmd.message||'!puan')}</h2><small class="muted">@${esc(cmd.username)} için hazırlandı</small></span><i class="pulse"></i></div>`;return}
 if(type==='myactions'){stage.innerHTML=(preview||Date.now()-Number(latest.createdAt||0)<6500)?`<div class="alert glass">${avatar(latest)}<span><span class="eyebrow">CANLI ETKİNLİK</span><h2>@${esc(latest.username)}</h2><small class="muted">${esc(activityText(latest))}</small></span>${latest.type==='gift'?giftImage(latest):'<i class="pulse"></i>'}</div>`:'';return}
 if(type==='carousel'){const entries=(a.length?a:(preview?sample.activities:[])).slice(0,8),track=entries.map(x=>`<span>${avatar(x,28)} ${x.type==='gift'?giftImage(x):''} @${esc(x.username)} <strong class="ticker-amount">${esc(activityText(x))}</strong></span>`).join('');stage.innerHTML=entries.length?`<div class="ticker"><small class="ticker-label">YAYININ NABZI</small><div class="ticker-track">${track}${track}</div></div>`:'';return}
 if(type==='wheel'){const trigger=recent('chat',x=>/^!(wheel|çark)\b/i.test(x.message||''));if(!preview&&!trigger){stage.innerHTML='';return}const labels=(params.get('segments')||'1\n2\n3\n4\n5\n6').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,16);const segments=labels.length>=2?labels:['1','2','3','4','5','6'];const rawColors=(params.get('wheelColors')||'#ff6282,#40e7df,#ffdb86,#c997b4,#67c4c2,#f4ad7f').split(',').map(x=>x.trim()).filter(x=>/^#[0-9a-f]{6}$/i.test(x));const colors=rawColors.length?rawColors:['#ff6282','#40e7df'];const step=360/segments.length,gradient=segments.map((_,i)=>`${colors[i%colors.length]} ${i*step}deg ${(i+1)*step}deg`).join(',');const seed=String(trigger?.id||'preview').split('').reduce((n,c)=>n*31+c.charCodeAt(0),0),winner=Math.abs(seed)%segments.length,stop=1440-winner*step-step/2;stage.innerHTML=`<i class="wheel-pin"></i><div class="wheel" style="--stop-angle:${stop}deg;background:conic-gradient(${gradient})">${segments.map((label,i)=>`<span class="wheel-label" style="--angle:${i*step+step/2}deg">${esc(label)}</span>`).join('')}<span class="wheel-hub">${artwork(5502)}</span></div><div class="wheel-result"><small>SONUÇ</small><span>${esc(segments[winner])}</span></div>`;return}
 const leaderBoard=(entries,title,valueOf)=>{const source=entries.length?entries:(preview?(type==='topgifter'?sample.topGifters:sample.topLikes):[]);return `<div class="leader-board"><div class="leader-heading">${artwork(type==='topgifter'?5502:5282)}<span>${title}<small>YAYININ YILDIZLARI</small></span></div><div class="leader-list unified">${source.slice(0,Math.max(6,items)).map((x,i)=>`<div class="item glass ${i===0?'champion':''}" style="--rank:${i}"><span class="place">${i+1}</span>${avatar(x)}<span><b title="@${esc(x.username||x.nickname)}">@${esc(x.username||x.nickname)}</b><small>${esc(x.nickname||x.username||'İzleyici')}</small></span><strong class="value">${valueOf(x)}</strong></div>`).join('')||'<div class="empty glass">Veri bekleniyor</div>'}</div></div>`};
 if(type==='topgifter'){stage.innerHTML=leaderBoard(gifters,'EN BÜYÜK DESTEKÇİLER',x=>`${Number(x.totalCoins||0).toLocaleString('tr-TR')}<small>COIN</small>`);return}
 if(type==='topliker'){stage.innerHTML=leaderBoard(likes,'KALP ŞAMPİYONLARI',x=>`${Number(x.totalLikes||0).toLocaleString('tr-TR')}<small>BEĞENİ</small>`);return}
 if(type==='ranking'){stage.innerHTML=list(ranking,x=>`${Number(x.score||0).toLocaleString('tr-TR')} puan`);return}
 if(type==='coindrop'){stage.innerHTML='';const gift=recent('gift');if(!gift)return;stage.innerHTML=`<div class="coins"><div class="coin-banner">${avatar(gift)}<span><b>@${esc(gift.username)}</b><strong>${Number(gift.coins||0).toLocaleString('tr-TR')} coin</strong></span>${giftImage(gift)}</div></div>`;for(let i=0;i<particleCount;i++){const c=document.createElement('i');c.className=i%5?'coin':'coin drop-gift';c.innerHTML=i%5?'M':giftImage(gift);c.style.setProperty('--left',`${Math.random()*80+3}%`);c.style.setProperty('--delay',`${-Math.random()*2.5}s`);stage.firstChild.append(c)}return}
 if(type==='timer'){if(!document.getElementById('clock'))stage.innerHTML='<div class="timer glass"><small>YAYIN SÜRESİ</small><b id="clock">00:00:00</b></div>';return}
 if(type==='songrequests'){const songs=chats.filter(x=>/^!play\s+/i.test(x.message||''));stage.innerHTML=`<div class="stack">${(songs.length?songs:[{username:'muzik_sever',message:'!play En sevdiğim şarkı'}]).slice(0,items).map((x,i)=>`<div class="item glass"><strong class="value">${i+1}</strong><span><b>${esc(String(x.message).replace(/^!play\s+/i,''))}</b><small>@${esc(x.username)}</small></span><span>♫</span></div>`).join('')}</div>`;return}
 if(type==='viewercount'){const count=Number(data.stats?.viewerCount||0).toLocaleString('tr-TR'),existing=stage.querySelector('.viewer-number');if(existing){existing.textContent=count;return}stage.innerHTML=`<div class="viewer glass"><span class="eye" aria-hidden="true">◉</span><span><span class="viewer-status">ANLIK İZLEYİCİ</span><b class="viewer-number">${count}</b><small>CANLI YAYINDA</small></span></div>`;return}
 if(type==='streambuddies'){stage.innerHTML='<div class="animal-buddies"></div>';(gifters.length?gifters:(preview?sample.topGifters:[])).slice(0,Math.min(items,6)).forEach((x,i)=>{const b=document.createElement('div');b.className='animal-buddy';b.style.setProperty('--delay',`${i*.09}s`);b.innerHTML=`${avatar(x,48)}<span class="buddy-animal">${artwork([5502,11046,11808,13447,5283,12203][i%6])}</span><b title="@${esc(x.username)}">@${esc(x.username)}</b><strong class="buddy-score">${Number(x.totalCoins||0).toLocaleString('tr-TR')}</strong>`;stage.firstChild.append(b)});return}
 if(type==='coinjar'){
   const gifts=(Array.isArray(data.jarGifts)?data.jarGifts:[]).filter(x=>Number(x.coins||0)>=Number(params.get('giftMinCoins')||0));
   window.updatePhysicalJar(gifts, data.stats?.totalCoins, data.stats?.totalGifts, {capacity:params.get('capacity'),giftSize:params.get('giftSize')||34,tint:params.get('jarTint')||accent});
   const host=stage.querySelector('.physics-jar');
   if(host&&!host.querySelector('.jar-crest')){const crest=document.createElement('div');crest.className='jar-crest';crest.innerHTML=`${artwork(5502)}<span>HEDİYE HAZİNESİ</span>`;host.append(crest)}
   const stamp=JSON.stringify(gifts.slice(0,1).map(x=>[x.id,x.count]));
   if(host&&gifts.length&&stamp!==lastJarEvent){lastJarEvent=stamp;host.querySelector('.jar-spark-layer')?.remove();const layer=document.createElement('div');layer.className='jar-spark-layer';for(let i=0;i<12;i++){const spark=document.createElement('i');spark.className='jar-spark';spark.style.setProperty('--sx',`${Math.cos(i/12*Math.PI*2)*70}px`);spark.style.setProperty('--sy',`${Math.sin(i/12*Math.PI*2)*65-20}px`);spark.style.setProperty('--spark-color',i%2?'var(--gold)':'var(--accent)');layer.append(spark)}host.append(layer)}
   return;
 }
 if(type==='tinydiny'){const goal=Math.max(100,Number(params.get('goal'))||5000),coins=Number(data.stats?.totalCoins||0),progress=Math.min(100,coins/goal*100),value=`${coins.toLocaleString('tr-TR')} <small>/ ${goal.toLocaleString('tr-TR')} COIN</small>`;if(stage.querySelector('.goal')){stage.querySelector('.goal-head>strong').innerHTML=value;stage.querySelector('.bar').style.setProperty('--progress',`${progress}%`);return}stage.innerHTML=`<div class="goal glass"><div class="goal-head">${artwork(8582)}<span><small class="eyebrow">BİRLİKTE DAHA İLERİ</small><h2>Yayın hedefi</h2></span><strong>${value}</strong></div><div class="bar" style="--progress:${progress}%"><i></i></div></div>`;return}
 stage.innerHTML='<div class="empty glass"><span class="eyebrow">TIKMNG WIDGET</span><b>Canlı veri bekleniyor</b></div>'}
function updateClock(){const el=document.getElementById('clock');if(!el)return;const seconds=Math.max(0,Math.floor((Date.now()-timerStarted)/1000));el.textContent=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':')}
const temporaryEffects=new Set(['cannon','likefountain','firework','emojify','transactionviewer','myactions','wheel','coindrop']);
function effectEvent(data){
 const activities=data.activities||[];
 if(type==='likefountain')return activities.find(x=>x.type==='like')||null;
 if(type==='wheel')return activities.find(x=>x.type==='chat'&&/^!(wheel|çark)\b/i.test(x.message||''))||null;
 if(type==='emojify')return activities.find(x=>x.type==='chat'&&/\p{Extended_Pictographic}/u.test(x.message||''))||null;
 if(type==='myactions')return activities[0]||null;
 return activities.find(x=>x.type==='gift')||null;
}
// A room heartbeat must never re-create a gift effect or reset a wheel spin.
function widgetInput(data){
 if(temporaryEffects.has(type))return effectEvent(data);
 switch(type){
  case 'topgift':return data.topGift||null;
  case 'topgifter':case 'streambuddies':return data.topGifters||[];
  case 'topliker':return data.topLikes||[];
  case 'ranking':return data.ranking||[];
  case 'coinjar':return [data.jarGifts||[],data.stats?.totalCoins||0,data.stats?.totalGifts||0];
  case 'viewercount':return data.stats?.viewerCount??0;
  case 'tinydiny':return data.stats?.totalCoins??0;
  case 'timer':return 'clock';
  case 'socialmediarotator':return data.channel||'';
  case 'userinfo':return data.activities?.[0]||null;
  case 'chat':case 'songrequests':return (data.activities||[]).filter(x=>x.type==='chat');
  case 'gifts':return (data.activities||[]).filter(x=>x.type==='gift');
  default:return data.activities||[];
 }
}
function updateWidget(data){
 const signature=JSON.stringify(widgetInput(data));
 if(signature===lastSignature)return;
 lastSignature=signature;
 clearTimeout(effectTimer);
 if(!data.topGift)delete stage.dataset.flipStamp;
 render(data);
 stage.getAnimations({subtree:true}).forEach(animation=>{animation.playbackRate=speed});
 if(!preview&&temporaryEffects.has(type)&&stage.childElementCount){
  const event=effectEvent(data),remaining=Math.max(0,6500-(Date.now()-Number(event?.createdAt||0)));
  effectTimer=setTimeout(()=>{if(lastSignature===signature)stage.replaceChildren()},remaining);
 }
}
let polling=false;
async function poll(){
 if(polling)return;
 polling=true;
 try{
  await jarReady;
  const url=new URL('/api/widget/state',location.origin);url.search=params.toString();
  const response=await fetch(prefixURL(url.pathname+url.search),{cache:'no-store'});
  if(!response.ok)throw new Error('Widget state unavailable');
  const data=await response.json();
  const input=widgetInput(data);
  const hasPreviewData=type==='coinjar'?(data.jarGifts||[]).length:typeof input==='number'?input>0:Array.isArray(input)?input.length>0:Boolean(input);
  updateWidget(preview&&!hasPreviewData?sample:data);
 }catch{if(preview&&!lastSignature)updateWidget(sample)}
 finally{polling=false}
}
poll();setInterval(poll,850);setInterval(updateClock,250);updateClock();
</script>
