/* Broadcast surfaces: neutral glass, stable data columns, readable compact previews. */
:root{--pink:#f48b82;--gold:#edcc82;--ink:#f5f6f5;--panel:rgba(24,27,29,.9);--secondary:#bac2c3;--edge:rgba(255,255,255,.16)}
body{padding:12px}.stage{min-width:0;min-height:0}.stage *{letter-spacing:0}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:8px;box-shadow:0 5px 16px #0003;backdrop-filter:blur(8px)}
.eyebrow{font-size:10px;line-height:1.4;font-weight:700}.muted{color:var(--secondary)}
.avatar{flex:none;width:42px;height:42px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:#343c3e;color:#f5f6f5;font-size:17px;font-weight:700}
.stack{width:min(440px,100%);max-height:100%;min-height:0;gap:6px;overflow:hidden;align-content:start}
.item{grid-template-columns:42px minmax(0,1fr) auto;min-width:0;min-height:58px;padding:9px 12px;gap:10px}
.item>span:not(.avatar){min-width:0}.item b{font-size:14px;line-height:1.3;font-weight:650}.item small{font-size:11px;line-height:1.4;color:var(--secondary)}
.value{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rank .item{grid-template-columns:22px 42px minmax(0,1fr) auto}.rank .item:before{width:22px;height:22px;border-radius:4px;background:#363b3c;color:var(--secondary)}
.rank .item:first-child{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.leader-board{width:min(480px,100%);max-height:100%;gap:8px;padding:0;grid-template-rows:auto minmax(0,1fr)}
.leader-heading{padding:9px 12px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);color:var(--secondary);font-size:11px;font-weight:700;text-align:left;box-shadow:none}
.leader-list,.leader-list.unified{display:grid;max-height:none;min-height:0;overflow:hidden;gap:5px;align-content:start}
.leader-list.unified .item{grid-template-columns:22px 38px minmax(0,1fr) auto;min-height:56px;padding:8px 10px;border:1px solid var(--edge);border-left:2px solid var(--accent);background:var(--panel);box-shadow:none;gap:8px}
.leader-list.unified .item.champion{min-height:64px;border-color:color-mix(in srgb,var(--gold) 45%,transparent);border-left-color:var(--gold);background:rgba(39,36,29,.92);box-shadow:none}
.leader-list .place{width:22px;height:22px;background:#363b3c;color:var(--secondary);border-radius:4px;font-size:11px}
.leader-list .champion .place{background:var(--gold);color:#29251d}.leader-list.unified .avatar,.leader-list.unified .champion .avatar{width:38px;height:38px}
.hero{width:min(460px,100%);padding:18px;border-left:3px solid var(--accent)}
.hero-main{grid-template-columns:56px minmax(0,1fr) auto;gap:12px}.hero-main>span:not(.avatar){min-width:0}.hero .avatar{width:56px;height:56px}
.hero h1{margin:5px 0;font-size:20px;line-height:1.25;overflow-wrap:anywhere}.hero .muted{display:block;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.hero-score{font-size:23px;white-space:nowrap}
.viewer{max-width:100%;padding:18px 22px;gap:16px;border-left:3px solid var(--accent)}
.viewer .eye{width:42px;height:42px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:23px}
.viewer b{font-size:38px;line-height:1.15;font-weight:750;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.viewer small{display:block;margin-top:4px;font-size:12px;color:var(--secondary)}
.timer{min-width:0;max-width:100%;padding:17px 24px;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 5px 16px #0003}
.timer small{font-size:10px;margin-bottom:8px}.timer b{font-size:42px;line-height:1.2;text-shadow:none;font-weight:700}
.ticker{padding:12px 0;border-radius:6px;border:1px solid var(--edge);border-left:3px solid var(--accent);background:var(--panel)}
.ticker span{font-size:13px;font-weight:600;white-space:nowrap;flex:none}.ticker .avatar{flex:none;border-width:1px}.ticker-track{gap:30px}
.flip-award{width:min(340px,100%);height:auto;max-height:100%;padding:18px;gap:12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-top:3px solid var(--gold);background:var(--panel);box-shadow:0 5px 16px #0003}
.flip-award:before,.flip-award:after{display:none}.viral-kicker{max-width:100%;width:auto;padding:0;border:0;border-radius:0;background:none;color:var(--gold);font-size:11px;font-weight:700;box-shadow:none}
.flip-scene{width:180px;height:188px}.profile-face .avatar{width:142px!important;height:142px!important;border:2px solid var(--gold)}
.flip-face{gap:9px;text-shadow:none}.flip-face b{font-size:13px}.gift-face .gift-img{width:140px;height:140px}.flip-coins{font-size:25px;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:none}
.wheel{--diameter:min(300px,calc(100vw - 54px),calc(100vh - 110px));width:var(--diameter);height:var(--diameter);border:6px solid #d4d9d6;box-shadow:0 8px 22px #0004;flex:none}
.wheel:after{inset:36%;border:3px solid #d4d9d6;background:#202627;font-size:12px;font-weight:750}
.wheel-label{width:30%;font-size:12px;line-height:1.3;font-weight:750;color:#202627;text-shadow:none;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(var(--diameter) * -.34)) rotate(calc(-1 * var(--angle)))}

.physics-jar{width:min(300px,calc(100vw - 60px),calc((100vh - 114px)*.833));margin-top:32px;margin-bottom:32px;border-color:#d7e4df9c;background:linear-gradient(100deg,#f4fff414,transparent 22% 76%,#f4fff426);box-shadow:inset 8px 0 16px #fff2,inset -8px 0 14px #fff1,0 10px 18px #0003}
.physics-jar::before{border-color:#d7e4df9c;background:repeating-linear-gradient(0deg,#fff3 0 2px,#d4e2da12 3px 7px)}
.physics-jar-cap{border-color:#e4ebe5bf;background:#242b2780;box-shadow:0 3px 0 #d7e4df66,inset 0 2px 4px #0007}
.physics-jar-total{max-width:calc(100vw - 24px);padding:6px 12px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);font-size:12px;color:var(--gold);white-space:nowrap;text-shadow:none}
.physics-jar-glass{background:linear-gradient(96deg,transparent 8%,#fff3 11%,transparent 18% 82%,#fff3 88%,transparent 94%);border-bottom:3px solid #e3efe755}
.animal-buddies{width:100%;max-height:100%;display:flex;flex-wrap:wrap;gap:16px 12px;align-content:center;align-items:end}
.animal-buddy{min-width:0;flex:0 1 90px;gap:5px}.animal-buddy b{width:100%;max-width:100%;padding:4px;border-radius:4px;background:var(--panel);font-size:10px;white-space:nowrap;text-align:center;text-shadow:none}
.buddy-animal{font-size:50px}.animal-buddy .avatar{width:42px!important;height:42px!important}
.goal{width:min(460px,100%);padding:18px}.goal-head{gap:12px;align-items:center;flex-wrap:wrap}.goal h2{font-size:19px;line-height:1.3;margin:5px 0}.goal-head>strong{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}.bar{height:12px;padding:2px;margin-top:14px;background:#383e3d;border:0}.bar>i{background:var(--accent);box-shadow:none;max-width:100%}
.coin{box-shadow:0 2px 5px #0004;border-color:#f5e0a3;background:var(--gold);color:#655026;font-size:14px}
.heart{text-shadow:0 2px 7px #0003;font-style:normal}
.social{max-width:100%;background:var(--panel)}.social>span:last-child{min-width:0}.social b{display:block;overflow-wrap:anywhere;font-size:17px}.social .mark{background:var(--accent);color:#202627}
.alert{width:min(460px,100%);grid-template-columns:48px minmax(0,1fr) auto;padding:15px;gap:12px}.alert .avatar{width:48px;height:48px}.alert h2{font-size:19px;overflow-wrap:anywhere}.alert small{overflow-wrap:anywhere}
@media(max-width:340px){body{padding:8px}.item{padding:7px 8px;gap:7px;min-height:49px;grid-template-columns:32px minmax(0,1fr) auto}.avatar{width:32px;height:32px;font-size:13px}.item b{font-size:12px}.item small{font-size:10px}.value{font-size:12px}.rank .item{grid-template-columns:18px 30px minmax(0,1fr) auto;gap:5px}.rank .item:before{width:18px;height:18px}
.leader-list.unified .item{grid-template-columns:18px 30px minmax(0,1fr) auto;padding:6px;gap:5px;min-height:46px}.leader-list.unified .item.champion{min-height:50px}.leader-list.unified .avatar,.leader-list.unified .champion .avatar{width:30px;height:30px}.leader-list .place{width:18px;height:18px;font-size:10px}.leader-heading{padding:8px;font-size:10px}
.hero{padding:12px}.hero-main{grid-template-columns:40px minmax(0,1fr) auto;gap:8px}.hero .avatar{width:40px;height:40px}.hero h1{font-size:16px}.hero-score{font-size:18px}.hero .muted{font-size:11px}.viewer{padding:14px;gap:10px}.viewer b{font-size:30px}.viewer .eye{width:34px;height:34px}.timer{padding:16px}.timer b{font-size:32px}.goal{padding:13px}.goal h2{font-size:17px}.flip-award{padding:14px}.wheel-label{font-size:10px}.animal-buddies{gap:12px 8px}.animal-buddy{flex-basis:64px}.buddy-animal{font-size:38px}.animal-buddy .avatar{width:32px!important;height:32px!important}}
@media(max-height:280px){.leader-board{gap:4px}.leader-heading{padding:6px 9px}.leader-list.unified{gap:3px}.leader-list.unified .item,.leader-list.unified .item.champion{min-height:32px;padding:3px 7px;grid-template-columns:18px 25px minmax(0,1fr) auto}.leader-list.unified .avatar,.leader-list.unified .champion .avatar{width:25px;height:25px}.leader-list .item b{font-size:11px}.leader-list .item small{display:none}.leader-list .value{font-size:11px}.leader-list{display:grid}.flip-award{padding:10px;gap:6px}.flip-scene{width:100px;height:112px}.profile-face .avatar{width:82px!important;height:82px!important}.gift-face .gift-img{width:80px;height:80px}.flip-coins{font-size:20px}.animal-buddies{gap:7px}.animal-buddy{flex-basis:60px}.buddy-animal{font-size:34px}.animal-buddy .avatar{width:28px!important;height:28px!important}}
@media(prefers-reduced-motion:reduce){.flip-surface,.animal-buddy,.social,.alert,.heart,.coin{animation-duration:12s}.wheel{animation-duration:.01ms}.wheel-result{animation-delay:0s}}

<body><main id="stage" class="stage"></main>
<script src="/widget/vendor/matter.js"></script>
<script src="/widget/physical-jar.js"></script>
<script>
const params=new URLSearchParams(location.search),type=params.get('type')||'myactions',preview=params.get('preview')==='1',items=Math.max(3,Math.min(13,Number(params.get('items'))||6));document.body.classList.toggle('preview-mode',preview);
const accent=/^#[0-9a-f]{6}$/i.test(params.get('accent')||'')?params.get('accent'):'#63c9ba';document.documentElement.style.setProperty('--accent',accent);document.body.dataset.widget=type;
const clamp=(key,min,max,fallback)=>Math.max(min,Math.min(max,Number(params.get(key))||fallback));
const stage=document.getElementById('stage');let lastSignature='',lastEventId='',timerStarted=Date.now();
stage.style.transform=`scale(${clamp('scale',50,160,100)/100})`;
stage.style.translate=`${Math.max(-500,Math.min(500,Number(params.get('offsetX'))||0))}px ${Math.max(-500,Math.min(500,Number(params.get('offsetY'))||0))}px`;
stage.style.opacity=String(clamp('opacity',25,100,100)/100);
stage.style.justifyItems=({left:'start',center:'center',right:'end'})[params.get('position')]||'center';
const speed=clamp('speed',40,250,100)/100,particleCount=clamp('particles',4,100,24);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sampleGiftImage=`/widget/gift-assets/5655.png?key=${encodeURIComponent(params.get('key')||'')}&channel=${encodeURIComponent(params.get('channel')||'')}`;
const sample={channel:'mngcanli',stats:{totalLikes:4860,totalCoins:1280,totalGifts:74,totalShares:32,followers:18,subscribers:4,viewerCount:128,topStreak:{username:'mng_destekci',nickname:'MNG Destekçi',giftName:'Gül',count:12}},topGift:{username:'mng_destekci',nickname:'MNG Destekçi',giftName:'Gül',count:5,coins:125,giftImage:sampleGiftImage},topLikes:[['kalp_yagmuru',2450],['yayin_dostu',1980],['oyun_sever',1640],['neon_kral',1220]].map(([username,totalLikes])=>({username,nickname:username.replaceAll('_',' '),totalLikes})),topGifters:[['mng_destekci',1280],['yildiz_destekci',940],['gece_kartali',610],['oyun_sever',420]].map(([username,totalCoins])=>({username,nickname:username.replaceAll('_',' '),totalCoins,giftCount:8})),activities:[{id:'a1',type:'gift',username:'mng_destekci',nickname:'MNG Destekçi',giftName:'Gül',giftImage:sampleGiftImage,count:5,coins:5,message:''},{id:'a2',type:'like',username:'kalp_yagmuru',nickname:'Kalp Yağmuru',count:240,message:''},{id:'a3',type:'follow',username:'yeni_takipci',nickname:'Yeni Takipçi',count:1,message:''},{id:'a4',type:'chat',username:'yayin_dostu',nickname:'Yayın Dostu',message:'Harika yayın! ❤️🔥👏',count:1},{id:'a5',type:'chat',username:'muzik_sever',nickname:'Müzik Sever',message:'!play En sevdiğim şarkı',count:1}],ranking:[]};sample.jarGifts=Array.from({length:74},(_,i)=>({...sample.activities[0],id:`preview-${i}`,count:1,coins:i===0?2000:i===1?1000:1,giftImage:i%9===0?`/widget/gift-assets/6064.png?key=${encodeURIComponent(params.get('key')||'')}&channel=${encodeURIComponent(params.get('channel')||'')}`:sampleGiftImage}));sample.ranking=sample.topGifters.map((x,i)=>({...x,totalLikes:sample.topLikes[i]?.totalLikes||0,score:x.totalCoins*2+Math.floor((sample.topLikes[i]?.totalLikes||0)/50)}));
function avatar(x,size=''){const name=esc(x?.nickname||x?.username||'İzleyici'),style=size?` style="width:${size}px;height:${size}px"`:'';return `<span class="avatar"${style}>${x?.avatar?`<img src="${esc(x.avatar)}" alt="" onerror="this.remove()">`:esc(name[0]||'İ')}</span>`}
function giftImage(x){return x?.giftImage?`<img class="gift-img" src="${esc(x.giftImage)}" alt="" onerror="this.hidden=true">`:`<span class="gift-img" style="display:grid;place-items:center;font-size:36px">🎁</span>`}
function activityText(x){return x.type==='gift'?`${x.giftName||'Hediye'} ×${x.count||1} · ${x.coins||0} coin`:x.type==='like'?`${x.count||1} beğeni`:x.type==='follow'?'Takip etti':x.type==='share'?`${x.count||1} paylaşım`:x.type==='member'?'Yayına katıldı':x.message||'Yeni etkinlik'}
function list(entries,value){return `<div class="stack rank">${entries.slice(0,items).map(x=>`<div class="item glass">${avatar(x)}<span><b>@${esc(x.username||x.nickname)}</b><small>${esc(x.nickname||'Canlı destekçi')}</small></span><strong class="value">${esc(value(x))}</strong></div>`).join('')||'<div class="empty glass">Veri bekleniyor</div>'}</div>`}
function hearts(){stage.innerHTML='';for(let i=0;i<particleCount;i++){const h=document.createElement('i');h.className='heart';h.textContent=i%4?'♥':'❤';h.style.left=`${4+Math.random()*92}%`;h.style.setProperty('--drift',`${-60+Math.random()*120}px`);h.style.animationDelay=`${Math.random()*2.8}s`;stage.append(h)}}
function particles(gift){stage.innerHTML=`<div class="fireworks"></div><div class="fire-label glass">${giftImage(gift)}<span class="eyebrow">@${esc(gift.username)}</span><b>${esc(gift.giftName)} ×${gift.count||1}</b></div>`;const host=stage.firstChild;for(let i=0;i<particleCount;i++){const s=document.createElement('i'),a=Math.random()*Math.PI*2,d=45+Math.random()*120;s.className='spark';s.style.left=`${30+Math.random()*40}%`;s.style.top=`${28+Math.random()*36}%`;s.style.setProperty('--x',`${Math.cos(a)*d}px`);s.style.setProperty('--y',`${Math.sin(a)*d}px`);s.style.setProperty('--c',['#25f4ee','#fe2c55','#ffd65a','#8d6bff'][i%4]);s.style.setProperty('--delay',`${Math.random()*.7}s`);host.append(s)}}
function render(data){const a=data.activities||[],latest=a[0]||(preview?sample.activities[0]:{}),gifts=a.filter(x=>x.type==='gift'),chats=a.filter(x=>x.type==='chat'),gifters=data.topGifters||[],likes=data.topLikes||[],ranking=data.ranking||[];
 const recent=(kind,matcher=()=>true)=>a.find(x=>x.type===kind&&matcher(x)&&(preview||Date.now()-Number(x.createdAt||0)<6500));
 if(type==='cannon'){const gift=recent('gift');stage.innerHTML=gift?`<div class="flyer glass">${avatar(gift,72)}<span><span class="eyebrow">@${esc(gift.username)}</span><b>${esc(gift.giftName||'Hediye')} ×${gift.count||1}</b></span>${giftImage(gift)}</div>`:'';return}
 if(type==='likefountain'){if(recent('like'))hearts();else stage.innerHTML='';return}
 if(type==='socialmediarotator'){stage.innerHTML=`<div class="social glass"><span class="mark">@</span><span><small class="eyebrow">TIKTOK CANLI</small><b>@${esc(data.channel||'yayinci')}</b></span></div>`;return}
 if(type==='firework'){const gift=recent('gift');if(gift)particles(gift);else stage.innerHTML='';return}
 if(type==='emojify'){stage.innerHTML='';const chat=recent('chat',x=>/\p{Extended_Pictographic}/u.test(x.message||''));if(!chat)return;const emojis=(String(chat.message).match(/\p{Extended_Pictographic}/gu)||[]);for(let i=0;i<particleCount;i++){const e=document.createElement('span');e.className='emoji';e.textContent=emojis[i%emojis.length];e.style.setProperty('--top',`${5+(i*17)%85}%`);e.style.setProperty('--delay',`${-i*.31}s`);stage.append(e)}return}
 if(type==='chat'){stage.innerHTML=`<div class="stack">${chats.slice(0,items).map(x=>`<div class="item glass">${avatar(x)}<span><b>@${esc(x.username)}</b><small>${esc(x.message||'Canlı yayına katıldı')}</small></span></div>`).join('')||'<div class="empty glass">Sohbet bekleniyor</div>'}</div>`;return}
 if(type==='gifts'){stage.innerHTML=`<div class="stack">${gifts.slice(0,items).map(x=>`<div class="item glass">${avatar(x)}<span><b>@${esc(x.username)}</b><small>${esc(x.giftName)} ×${x.count||1}</small></span>${giftImage(x)}</div>`).join('')||'<div class="empty glass">Hediye bekleniyor</div>'}</div>`;return}
 if(type==='transactionviewer'){const gift=recent('gift');stage.innerHTML=gift?`<div class="hero glass"><div class="hero-main">${avatar(gift)}<span><span class="eyebrow">YENİ KATKI</span><h1>@${esc(gift.username)}</h1></span><strong class="hero-score">+${gift.coins||gift.count||1}</strong></div></div>`:'';return}
 if(type==='userinfo'){stage.innerHTML=latest.username?`<div class="hero glass"><div class="hero-main">${avatar(latest)}<span><span class="eyebrow">İZLEYİCİ BİLGİSİ</span><h1>@${esc(latest.username)}</h1><small class="muted">${esc(activityText(latest))}</small></span><strong class="hero-score">★</strong></div></div>`:'<div class="empty glass">İzleyici bekleniyor</div>';return}
 if(type==='topgift'){const best=data.topGift;if(!best){stage.innerHTML=preview?'<div class="empty glass">Hediye bekleniyor</div>':'';return}const stamp=JSON.stringify([best.username,best.giftName,best.coins,best.count,best.avatar]);if(stage.dataset.flipStamp===stamp)return;stage.dataset.flipStamp=stamp;stage.innerHTML=`<div class="flip-award"><div class="viral-kicker">EN BÜYÜK HEDİYE</div><div class="flip-scene"><div class="flip-surface"><div class="flip-face profile-face">${avatar(best,150)}<b>@${esc(best.username||best.nickname)}</b></div><div class="flip-face gift-face">${giftImage(best)}<b>${esc(best.giftName)} ×${Number(best.count||1)}</b></div></div></div><strong class="flip-coins">${Number(best.coins||0).toLocaleString('tr-TR')} COIN</strong></div>`;return}
 if(type==='commandinfo'){const cmd=chats.find(x=>String(x.message||'').startsWith('!'))||latest;stage.innerHTML=`<div class="alert glass">${avatar(cmd)}<span><span class="eyebrow">KOMUT SONUCU</span><h2>${esc(cmd.message||'!puan')}</h2><small class="muted">@${esc(cmd.username)} için hazırlandı</small></span><i class="pulse"></i></div>`;return}
 if(type==='myactions'){stage.innerHTML=(preview||Date.now()-Number(latest.createdAt||0)<6500)?`<div class="alert glass">${avatar(latest)}<span><span class="eyebrow">CANLI ETKİNLİK</span><h2>@${esc(latest.username)}</h2><small class="muted">${esc(activityText(latest))}</small></span>${latest.type==='gift'?giftImage(latest):'<i class="pulse"></i>'}</div>`:'';return}
 if(type==='carousel'){const entries=(a.length?a:(preview?sample.activities:[])).slice(0,8),track=entries.map(x=>`<span>${avatar(x,28)} ${x.type==='gift'?giftImage(x):'<i>●</i>'} @${esc(x.username)} · ${esc(activityText(x))}</span>`).join('');stage.innerHTML=`<div class="ticker"><div class="ticker-track">${track}${track}</div></div>`;return}
 if(type==='wheel'){const trigger=recent('chat',x=>/^!(wheel|çark)\b/i.test(x.message||''));if(!preview&&!trigger){stage.innerHTML='';return}const labels=(params.get('segments')||'1\n2\n3\n4\n5\n6').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,16);const segments=labels.length>=2?labels:['1','2','3','4','5','6'];const rawColors=(params.get('wheelColors')||'#f48b82,#63c9ba,#edcc82,#c5d5ce,#b0d9cf,#dfb7a9').split(',').map(x=>x.trim()).filter(x=>/^#[0-9a-f]{6}$/i.test(x));const colors=rawColors.length?rawColors:['#f48b82','#63c9ba'];const step=360/segments.length,gradient=segments.map((_,i)=>`${colors[i%colors.length]} ${i*step}deg ${(i+1)*step}deg`).join(',');const seed=String(trigger?.id||'preview').split('').reduce((n,c)=>n*31+c.charCodeAt(0),0),winner=Math.abs(seed)%segments.length,stop=1440-winner*step-step/2;stage.innerHTML=`<i class="wheel-pin"></i><div class="wheel" style="--stop-angle:${stop}deg;background:conic-gradient(${gradient})">${segments.map((label,i)=>`<span class="wheel-label" style="--angle:${i*step+step/2}deg">${esc(label)}</span>`).join('')}</div><div class="wheel-result">${esc(segments[winner])}</div>`;return}
 const leaderBoard=(entries,title,valueOf)=>{const source=entries.length?entries:(preview?(title.includes('COIN')?sample.topGifters:sample.topLikes):[]);return `<div class="leader-board"><div class="leader-heading">${title}</div><div class="leader-list unified">${source.slice(0,Math.max(6,items)).map((x,i)=>`<div class="item glass ${i===0?'champion':''}"><span class="place">${i===0?'♛':i+1}</span>${avatar(x)}<span><b>@${esc(x.username||x.nickname)}</b><small>${esc(x.nickname||x.username||'İzleyici')}</small></span><strong class="value">${valueOf(x)}</strong></div>`).join('')||'<div class="empty glass">Veri bekleniyor</div>'}</div></div>`};
 if(type==='topgifter'){stage.innerHTML=leaderBoard(gifters,'♛ COIN SIRALAMASI',x=>`${Number(x.totalCoins||0).toLocaleString('tr-TR')} coin`);return}
 if(type==='topliker'){stage.innerHTML=leaderBoard(likes,'♥ BEĞENİ SIRALAMASI',x=>`${Number(x.totalLikes||0).toLocaleString('tr-TR')} ♥`);return}
 if(type==='ranking'){stage.innerHTML=list(ranking,x=>`${Number(x.score||0).toLocaleString('tr-TR')} puan`);return}
 if(type==='coindrop'){stage.innerHTML='';if(!recent('gift'))return;stage.innerHTML='<div class="coins"></div>';for(let i=0;i<particleCount;i++){const c=document.createElement('i');c.className='coin';c.textContent='★';c.style.setProperty('--left',`${Math.random()*94}%`);c.style.setProperty('--delay',`${-Math.random()*2.8}s`);stage.firstChild.append(c)}return}
 if(type==='timer'){if(!document.getElementById('clock'))stage.innerHTML='<div class="timer glass"><small>YAYIN SÜRESİ</small><b id="clock">00:00:00</b></div>';return}
 if(type==='songrequests'){const songs=chats.filter(x=>/^!play\s+/i.test(x.message||''));stage.innerHTML=`<div class="stack">${(songs.length?songs:[{username:'muzik_sever',message:'!play En sevdiğim şarkı'}]).slice(0,items).map((x,i)=>`<div class="item glass"><strong class="value">${i+1}</strong><span><b>${esc(String(x.message).replace(/^!play\s+/i,''))}</b><small>@${esc(x.username)}</small></span><span>♫</span></div>`).join('')}</div>`;return}
 if(type==='viewercount'){stage.innerHTML=`<div class="viewer glass"><span class="eye" aria-hidden="true">◉</span><span><b class="viewer-number">${Number(data.stats?.viewerCount||0).toLocaleString('tr-TR')}</b><small>canlı izleyici</small></span></div>`;return}
 if(type==='streambuddies'){stage.innerHTML='<div class="animal-buddies"></div>';(gifters.length?gifters:(preview?sample.topGifters:[])).slice(0,Math.min(items,6)).forEach((x,i)=>{const b=document.createElement('div');b.className='animal-buddy';b.style.setProperty('--delay',`${i*.2}s`);b.innerHTML=`${avatar(x,48)}<span class="buddy-animal">${['🦁','🐺','🐍','🐻','🦊','🐼'][i%6]}</span><b>@${esc(x.username)}</b>`;stage.firstChild.append(b)});return}
 if(type==='coinjar'){
   const gifts=(Array.isArray(data.jarGifts)?data.jarGifts:[]).filter(x=>Number(x.coins||0)>=Number(params.get('giftMinCoins')||0));
   window.updatePhysicalJar(gifts, data.stats?.totalCoins, data.stats?.totalGifts, {capacity:params.get('capacity'),giftSize:params.get('giftSize'),tint:params.get('jarTint')||accent});
   return;
 }
 if(type==='tinydiny'){const goal=Math.max(100,Number(params.get('goal'))||5000),coins=Number(data.stats?.totalCoins||0),progress=Math.min(100,coins/goal*100);stage.innerHTML=`<div class="goal glass"><div class="goal-head"><span><small class="eyebrow">HEDİYE HEDEFİ</small><h2>Birlikte dolduralım</h2></span><strong>${coins.toLocaleString('tr-TR')} / ${goal.toLocaleString('tr-TR')}</strong></div><div class="bar" style="--progress:${progress}%"><i></i></div></div>`;return}
 stage.innerHTML='<div class="empty glass"><span class="eyebrow">TIKMNG WIDGET</span><b>Canlı veri bekleniyor</b></div>'}
function updateClock(){const el=document.getElementById('clock');if(!el)return;const seconds=Math.max(0,Math.floor((Date.now()-timerStarted)/1000));el.textContent=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':')}
async function poll(){try{const url=new URL('/api/widget/state',location.origin);url.search=params.toString();const data=await fetch(url,{cache:'no-store'}).then(r=>r.json());const hasPreviewData=(data.activities||[]).length||(data.jarGifts||[]).length||data.topGift||(data.topGifters||[]).length||(data.topLikes||[]).length||(data.ranking||[]).length||(type==='viewercount'&&Object.prototype.hasOwnProperty.call(data.stats||{},'viewerCount'));const usable=preview&&!hasPreviewData?sample:data;const sig=JSON.stringify([usable.updatedAt,usable.activities?.[0]?.id,usable.jarGifts?.[0]?.id,usable.stats,usable.topGifters,usable.topLikes,usable.topGift,usable.ranking]);if(sig!==lastSignature){lastSignature=sig;if(!usable.topGift)delete stage.dataset.flipStamp;render(usable);stage.getAnimations({subtree:true}).forEach(animation=>{animation.playbackRate=speed});if(!preview&&['cannon','likefountain','firework','emojify','transactionviewer','myactions','wheel','coindrop'].includes(type))setTimeout(()=>{if(lastSignature===sig)stage.innerHTML=''},6500)}}catch{if(preview&&!lastSignature){lastSignature='sample';render(sample)}}}
poll();setInterval(poll,850);setInterval(updateClock,250);updateClock();
</script>
