<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#fff}.widget{width:100%;height:100%;display:grid;grid-template-rows:auto 205px 1fr;padding:10px 12px;text-shadow:0 3px 12px #000}.title{text-align:center;font-size:22px;font-weight:1000}.title span{color:#25f4ee}.podium{display:flex;justify-content:center;align-items:flex-end;gap:0;padding:5px 0 14px}.person{width:106px;min-width:0;text-align:center;position:relative;animation:rise .55s both}.person.first{order:2;width:132px;z-index:3}.person.second{order:1;margin-right:-13px;z-index:2}.person.third{order:3;margin-left:-13px;z-index:1}.avatar{position:relative;margin:auto;width:96px;height:96px;border-radius:50%;border:4px solid #dce8ff;background:#172033;box-shadow:0 10px 30px rgba(0,0,0,.65);overflow:hidden}.first .avatar{width:126px;height:126px;border-color:#ffe04d;box-shadow:0 0 34px rgba(255,216,55,.56),0 12px 30px #000}.third .avatar{width:90px;height:90px;border-color:#e2a77b}.avatar img{width:100%;height:100%;object-fit:cover}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#25f4ee,#fe2c55);font-size:31px;font-weight:1000}.rank{position:absolute;left:50%;top:82px;transform:translateX(-50%);display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#152139;border:2px solid currentColor;font-size:13px;font-weight:1000}.first .rank{top:111px;background:#ad7e00;color:#fff3a2}.third .rank{top:77px}.name{margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900}.likes{color:#ff6c8c;font-size:13px;font-weight:1000}.list{display:grid;grid-auto-rows:35px;gap:4px;min-height:0}.row{display:grid;grid-template-columns:26px 29px minmax(0,1fr) auto;align-items:center;gap:8px;padding:3px 10px;border-left:3px solid #25f4ee;background:linear-gradient(90deg,rgba(7,20,35,.86),rgba(19,10,28,.7));backdrop-filter:blur(8px);animation:slide .45s both}.row-rank{font-weight:1000;color:#7decea}.row-avatar{position:relative;width:27px;height:27px;border-radius:50%;object-fit:cover;overflow:hidden;background:#1c2940}.row-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:850}.row-likes{font-size:12px;color:#ff7894;font-weight:1000}.empty{align-self:center;text-align:center;color:rgba(255,255,255,.7)}@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
</style><style>.widget{width:min(330px,100%);grid-template-rows:auto 152px 1fr;padding:8px}.title{font-size:18px}.podium{padding:3px 0 8px}.person{width:82px}.person.first{width:100px}.avatar{width:68px;height:68px;border-width:3px}.first .avatar{width:88px;height:88px}.third .avatar{width:64px;height:64px}.rank{top:55px;width:24px;height:24px}.first .rank{top:74px}.third .rank{top:51px}.name{margin-top:7px;font-size:10px}.likes{font-size:11px}.list{grid-auto-rows:31px;gap:3px}.row{grid-template-columns:22px 25px minmax(0,1fr) auto;gap:6px;padding:2px 8px;animation:none}.row-avatar{width:24px;height:24px}.row-name,.row-likes{font-size:11px}</style></head><body><main class="widget"><div class="title">EN ÇOK <span>BEĞENENLER</span></div><section class="podium" id="podium"></section><section class="list" id="list"><div class="empty">Beğeniler bekleniyor</div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('tr-TR');let signature='';const params=new URLSearchParams(location.search),key=params.get('key')||'',widgetChannel=params.get('channel')||'',itemCount=Math.max(4,Math.min(10,Number(params.get('items'))||6)),accent=params.get('accent');if(accent&&/^#[0-9a-f]{6}$/i.test(accent)){document.querySelector('.title span').style.color=accent;document.documentElement.style.setProperty('--widget-accent',accent)}function avatar(e){const initial=esc((e.nickname||e.username||'?').slice(0,1).toLocaleUpperCase('tr-TR'));return `<div class="avatar">${e.avatar?`<img src="${esc(e.avatar)}" alt="">`:''}<div class="fallback" style="display:${e.avatar?'none':'grid'}">${initial}</div></div>`}function render(entries){const next=JSON.stringify(entries.map(e=>[e.username,e.avatar,e.totalLikes]));if(next===signature)return;signature=next;const top=entries.slice(0,3),order=[top[1],top[0],top[2]],classes=['second','first','third'],ranks=[2,1,3];podium.innerHTML=order.map((e,i)=>e?`<article class="person ${classes[i]}">${avatar(e)}<div class="rank">${ranks[i]}</div><div class="name">@${esc(e.username)}</div><div class="likes">♥ ${fmt(e.totalLikes)}</div></article>`:'').join('');const rest=entries.slice(3,3+itemCount);list.innerHTML=rest.length?rest.map((e,i)=>`<div class="row" style="border-left-color:${accent||'#25f4ee'}"><span class="row-rank">${i+4}</span>${e.avatar?`<img class="row-avatar" src="${esc(e.avatar)}" alt="">`:`<div class="row-avatar"><div class="fallback">${esc((e.nickname||e.username||'?').slice(0,1))}</div></div>`}<span class="row-name">@${esc(e.username)}</span><span class="row-likes">♥ ${fmt(e.totalLikes)}</span></div>`).join(''):'<div class="empty">Beğeniler bekleniyor</div>'}async function refresh(){try{const q=new URLSearchParams({key,channel:widgetChannel,t:Date.now()});const r=await fetch(`/widget/top-likes/state?${q}`,{cache:'no-store'});if(r.ok)render((await r.json()).entries||[])}catch{}}refresh();setInterval(refresh,1500);
</script></body></html>
