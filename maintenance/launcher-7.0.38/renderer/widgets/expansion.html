    function renderContest(l){

    function paintInstrument(time){
        if(!drawCanvas||!drawNode||stage.hidden||stage.dataset.cinematic==='ready')return;
        const rect=drawNode.parentElement,w=Math.round(rect.clientWidth),h=Math.round(rect.clientHeight);if(!w||!h)return;
        if(drawNode.width!==w||drawNode.height!==h){drawNode.width=w;drawNode.height=h;}
        const ctx=drawCanvas,p=parts.progress||0,l=parts.l,cx=w/2,cy=h*.58,r=Math.min(w*.34,h*.43),accent=config.accent;
        ctx.clearRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';
        const line=(x1,y1,x2,y2,color,width=2)=>{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
        const arc=(x,y,rad,a,b,color,width=4)=>{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,Math.max(1,rad),a,b);ctx.stroke();};
        if(l==='gauge'){
            arc(cx,h*.72,r*1.4,Math.PI,Math.PI*2,'#ffffff1c',16);arc(cx,h*.72,r*1.4,Math.PI,Math.PI+Math.PI*p,accent,16);
            for(let i=0;i<=20;i++){const a=Math.PI+i/20*Math.PI;line(cx+Math.cos(a)*r*1.58,h*.72+Math.sin(a)*r*1.58,cx+Math.cos(a)*r*1.68,h*.72+Math.sin(a)*r*1.68,i/20<=p?accent:'#ffffff40',2);}
        }else if(l==='ring'){
            arc(cx,cy,r,-Math.PI/2,Math.PI*1.5,'#ffffff14',16);arc(cx,cy,r,-Math.PI/2,-Math.PI/2+p*Math.PI*2,accent,16);
            for(let i=0;i<48;i++){const a=i/48*Math.PI*2-Math.PI/2;arc(cx,cy,r+22,a,a+.065,i/48<p?'#ffda7c':'#ffffff26',4);}arc(cx,cy,r-24,-Math.PI/2,-Math.PI/2+p*Math.PI*2,'#ff6e8b',2);
        }else if(l==='steps'){
            const bw=Math.min(65,w/10),gap=12,start=cx-(bw*8+gap*7)/2;for(let i=0;i<8;i++){const height=35+i*h*.065,x=start+i*(bw+gap),y=h*.94-height;ctx.fillStyle=i/8<p?accent:'#ffffff18';ctx.fillRect(x,y,bw,height);line(x,y,x+bw,y,i/8<p?'#e5fff7':'#ffffff40');}
        }else if(l==='bridge'){
            line(w*.12,h*.88,w*.88,h*.88,'#ffffff30',5);line(w*.18,h*.48,w*.18,h*.91,accent,5);line(w*.82,h*.48,w*.82,h*.91,accent,5);
            for(let i=0;i<14;i++){const x=w*(.18+i/13*.64),y=h*(.49+Math.sin(i/13*Math.PI)*.17),lit=i/13<p;line(x,y,x,h*.87,lit?accent:'#ffffff20',2);if(i<13)line(x,y,w*(.18+(i+1)/13*.64),h*(.49+Math.sin((i+1)/13*Math.PI)*.17),lit?accent:'#ffffff30',3);}
        }else if(l==='stars'){
            const points=[[.16,.71],[.29,.5],[.39,.75],[.51,.48],[.63,.7],[.76,.45],[.86,.64],[.69,.9],[.39,.94]];
            points.forEach(([x,y],i)=>{if(i){const last=points[i-1];line(last[0]*w,last[1]*h,x*w,y*h,i/9<p?accent:'#ffffff22');}ctx.fillStyle=i/9<p?'#ffda7c':'#7a858c';ctx.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4-Math.PI/2,rr=k%2?4:13;ctx.lineTo(x*w+Math.cos(a)*rr,y*h+Math.sin(a)*rr);}ctx.closePath();ctx.fill();});
        }else if(l==='thermo'){
            const x=w*.25,y=h*.12,bottom=h*.83,height=bottom-y;ctx.strokeStyle='#e4fff488';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-16,y,32,height,16);ctx.stroke();ctx.fillStyle=accent;ctx.fillRect(x-10,bottom-height*p,20,height*p);ctx.beginPath();ctx.arc(x,bottom+10,28,0,Math.PI*2);ctx.fill();for(let i=0;i<=10;i++)line(x+30,bottom-height*i/10,x+45+(i%5===0?15:0),bottom-height*i/10,'#ffffff55');
        }else if(l==='equalizer'){
            for(let i=0;i<30;i++){const amp=(.25+Math.abs(Math.sin(i*.6+(reduced.matches?0:time*.002))))*p,bar=Math.max(5,amp*h*.8);ctx.fillStyle=i%4===0?'#ffda7c':i%3===0?'#ff6e8b':accent;ctx.fillRect(15+i*(w-30)/30,h*.84-bar,(w-30)/30-7,bar);}
        }else if(l==='reactor'){
            arc(cx,h/2,r,0,Math.PI*2,'#ffffff24',2);for(let i=0;i<3;i++){const a=i*Math.PI*2/3+(reduced.matches?0:time*.0003);ctx.save();ctx.translate(cx,h/2);ctx.rotate(a);ctx.strokeStyle=i===1?'#ff6e8b':accent;ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(0,0,r,r*.32,0,0,Math.PI*2);ctx.stroke();ctx.restore();}ctx.fillStyle='#ffda7c';ctx.beginPath();ctx.arc(cx,h/2,12+p*30,0,Math.PI*2);ctx.fill();
        }else if(l==='pulse'){
            for(let y=25;y<h;y+=35)line(10,y,w-10,y,'#ffffff0e',1);for(let x=20;x<w;x+=40)line(x,10,x,h-10,'#ffffff0c',1);
            ctx.beginPath();ctx.strokeStyle=accent;ctx.lineWidth=3;for(let x=0;x<w;x+=3){const t=x/w*12+(reduced.matches?0:time*.001),peak=Math.pow(Math.max(0,Math.cos(t*2)),16),y=h/2+Math.sin(t*8)*h*.08*p-peak*h*.35*p;ctx.lineTo(x,y);}ctx.stroke();
        }
        painted++;
    }
    function diagnostics(){return {type,base,layout:spec?.layout||null,format,frameCount,renderCount,seen:seen.size,queue:queue.length,particles:particles.length,failures,active:!stage.hidden,current:current?.event?.id||null,soundCount,voices,painted,disposed,width:W,height:H,polling,demoPortraits:demoPortraitStatus,cinematic:cinematic?.getState()||null,cinematicError,unbox:unboxRenderer?.getState()||null,unboxPending:!!unboxPending,unboxError,unboxStyle:config.unboxStyle};}
    Object.defineProperty(window,'__expansionDiagnostics',{get:diagnostics});Object.defineProperty(window,'__widgetDiagnostics',{get:diagnostics});
    function scheduleFrame(){
        if(disposed||preview&&document.hidden)return;
        if(document.hidden)frameTimer=setTimeout(()=>{frameTimer=0;frame(performance.now());},1000/30);
        else frameRequest=requestAnimationFrame(frame);
    }
    function restartFrame(){cancelAnimationFrame(frameRequest);clearTimeout(frameTimer);frameRequest=frameTimer=0;scheduleFrame();}
    function frame(time){
        frameRequest=0;if(disposed)return;scheduleFrame();if(preview&&document.hidden)return;if(time-lastFrame<(preview?42:33))return;const dt=Math.min(.1,(time-lastFrame)/1000||.033);lastFrame=time;clock+=dt;frameCount++;
        const now=Date.now();if(eventEngine)advance(now);unboxRenderer?.update({progress:unboxProgress(now)});if(preview&&pattern!=='empty'&&now-lastDemo>Math.max(4500,config.duration*1000+350))seedDemo();
        if(frameCount%8===0)render(preview?demoState():state);
        paintInstrument(time);fctx.clearRect(0,0,W,H);particles=particles.filter(p=>p.life<p.max);for(const p of particles){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;fctx.globalAlpha=Math.max(0,1-p.life/p.max);fctx.fillStyle=p.color;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.life*2);fctx.fillRect(-p.r,-p.r,p.r*2,p.r);fctx.restore();}fctx.globalAlpha=1;
    }
    async function poll(){
        if(disposed||polling)return;if(preview&&document.hidden){pollTimer=setTimeout(poll,1000);return;}
        polling=true;controller=new AbortController();const timeout=setTimeout(()=>controller?.abort(),16000);
        try{const url=endpoint('/api/widget/state');if(cursor)url.searchParams.set('eventsAfter',String(cursor));if(preview)url.searchParams.set('preview','1');const result=await fetch(url,{cache:'no-store',signal:controller.signal});if(!result.ok)throw new Error('HTTP '+result.status);acceptState(await result.json());}
        catch(error){if(!disposed&&!(preview&&document.hidden)){failures++;if(preview){connection.hidden=false;set(connection,'Yayin baglantisi bekleniyor');}console.warn('[widget-expansion] State unavailable',error.name);}}
        finally{clearTimeout(timeout);polling=false;if(!disposed)pollTimer=setTimeout(poll,Math.min(8000,failures?750*2**Math.min(4,failures):400));}
    }
    const demoPeople=[],demoPortraits=[];
    let demoPortraitStatus='idle',demoSheet=null;
    function demoPortrait(index){
        if(demoPortraits[index])return demoPortraits[index];
        const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
        if(demoSheet){
            const half=demoSheet.naturalWidth/2,size=Math.min(half,demoSheet.naturalHeight)/(1+Math.floor(index/2)*.025);
            x.drawImage(demoSheet,half*(index%2)+(half-size)/2,(demoSheet.naturalHeight-size)/2,size,size,0,0,256,256);
        }else{
            x.fillStyle=['#263a40','#483341','#334338','#3a3b46'][index%4];x.fillRect(0,0,256,256);
            x.fillStyle='#f4fbf9';x.font='600 100px Segoe UI,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(['D','E','A','N','M','S','M','A'][index%8],128,132);
        }
        return demoPortraits[index]=c.toDataURL('image/png');
    }
    function loadDemoPortraits(){
        if(!preview)return;
        demoPortraitStatus='loading';const image=new Image();image.decoding='async';
        image.onload=()=>{
            if(disposed)return;demoSheet=image;demoPortraitStatus='ready';demoPortraits.length=0;demoPeople.length=0;
            const refresh=row=>{const index=Number(String(row?.username||'').replace(/^izleyici_/,''))-1;if(index>=0&&index<8)row.avatar=demoPortrait(index);};
            history.forEach(refresh);queue.forEach(refresh);if(current)refresh(current.event);
            votes.forEach(entry=>refresh(entry.row));contest.forEach(entry=>refresh(entry.row));
            renderSignature='';render(demoState());
        };
        image.onerror=()=>{if(!disposed)demoPortraitStatus='unavailable';};
        image.src=endpoint('/widget/gift-assets/royal-demo.png').href;
    }
    function demoState(){
        if(pattern==='empty')return {activities:[],topLikes:[],topGifters:[],stats:{}};
        if(!demoPeople.length)['Deniz','Elif','Atlas','Nehir','Mert','Selin','Mavi','Ada'].forEach((nickname,i)=>demoPeople.push({username:'izleyici_'+(i+1),nickname:pattern==='long'?'Uzun Kullanici Adi '+nickname+' Yayin Toplulugu':nickname,avatar:demoPortrait(i),totalLikes:4200-i*470,totalCoins:3200-i*330}));
        return {topLikes:demoPeople,topGifters:demoPeople,stats:{totalCoins:3200,totalLikes:6800,followers:64,totalShares:58,subscribers:37,totalGifts:72},activities:[]};
    }
    function seedDemo(){
        if(!preview||pattern==='empty'||disposed)return;lastDemo=Date.now();const data=demoState(),types=spec.source==='activities'?['gift','like','follow','share','member','chat']:['topLikes','topGifters','stats'].includes(spec.source)?[]:[spec.source];
        const amount=pattern==='burst'?80:['poll','race','arrival','wall','rail','ticker'].includes(spec.layout)?6:types.length>1?6:1;
        for(let i=0;i<amount;i++){const person=data.topLikes[i%data.topLikes.length],source=types[i%Math.max(1,types.length)];if(!source)break;const event={...person,id:'preview-'+lastDemo+'-'+i,type:source,createdAt:lastDemo+i,coins:Math.max(config.giftMinCoins,420),count:12,repeatCount:12,giftName:config.giftId&&config.giftId!=='5655'?'':'G\u00fcl',giftId:config.giftId||'5655',giftImage:config.giftId&&config.giftId!=='5655'?'':'/widget/gift-assets/5655.png',message:['poll','race'].includes(spec.layout)?i%2?config.commandB:config.commandA:pattern==='long'?'Bu yayinin toplulugu cok guzel! Uzun bir sohbet mesaji bile kendi alaninda kalmali. '.repeat(5):'Bu enerjiye bayildim!'};receive(event,lastDemo);}
        render(data);
    }
    addEventListener('message',event=>{
        if(!preview||event.source!==parent||event.origin!==location.origin||!event.data||typeof event.data!=='object')return;
        if(event.data.type==='tikmng-widget-draft'&&event.data.settings&&typeof event.data.settings==='object'){draft=event.data.settings;readConfig(state.studio?.settings?.[type]||{});mount();render(preview?demoState():state);}
        if(event.data.type==='tikmng-widget-audition'){current=null;queue=[];lastDemo=0;seedDemo();}
    });
    addEventListener('resize',fit);
    document.addEventListener('visibilitychange',()=>{restartFrame();if(!preview)return;document.documentElement.dataset.paused=String(document.hidden);if(document.hidden){pausedAt=Date.now();controller?.abort();audio?.suspend().catch(()=>{});}else{const gap=pausedAt?Date.now()-pausedAt:0;if(current){current.endsAt+=gap;current.startedAt+=gap;}history.forEach(e=>e._receivedAt+=gap);lastDemo+=gap;lastFrame=performance.now();clearTimeout(pollTimer);if(!polling)poll();}});
    addEventListener('pagehide',()=>{disposed=true;clearUnbox();cinematicEpoch++;cinematic?.dispose();demoSheet=null;demoPortraits.length=0;demoPeople.length=0;cancelAnimationFrame(frameRequest);clearTimeout(frameTimer);clearTimeout(pollTimer);controller?.abort();queue=[];particles=[];history=[];votes.clear();contest.clear();seen.clear();audio?.close().catch(()=>{});},{once:true});
    if(!spec){console.warn('[widget-expansion] Unknown base widget');return;}
    readConfig({});if(preview){seedDemo();render(demoState());loadDemoPortraits();}scheduleFrame();poll();
})();
