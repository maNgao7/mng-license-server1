</main>
<div id="impact-stage" hidden></div>

<div id="live-glove-stage" aria-hidden="true" hidden><i class="live-glove-fist"></i><i class="live-glove-flare"></i><i class="live-glove-fist"></i></div>
<script>
(() => {

    if (preview) stateURL.searchParams.set('preview', '1');
    const scene = document.getElementById('scene'), board = document.getElementById('scoreboard'),
        boostHost = document.getElementById('boosts'), alertHost = document.getElementById('alert');
    const bonusHost = document.getElementById('active-bonus'),
        resultHost = document.getElementById('result-stage'), confetti = document.getElementById('result-confetti');
    const defaults = Object.freeze({ showScores: true, showGlove: true, showMultiplier: true, showResults: true,
        showCountdown: true, accent: '#58e1c2', scale: 100, opacity: 100, offsetX: 0, offsetY: 0,
        layout: 'bar', profileLayout: 'split', portraitStyle: 'cloud', showCompanions: true, duration: 6, sound: false, volume: 50, theme: 'inferno', motif: 'flame', entrance: 'bottom', notification: 'both', impactScale: 100, quality: 'auto' });
    const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);

        zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.9 5.96A1 1 0 0 0 14 10h6a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.9-5.96A1 1 0 0 0 11 14z"/>',

        crown: '<path d="m2 4 3 12h14l3-12-6 7-4-8-4 8Zm3 16h14"/>' };

        demo = null, demoKey = '', lastRoom = '', lastReceivedAt = Date.now(), audio = null, configured = false, readySent = false;
    let bonusSignature = '', gloveSignature = '', resultSignature = '', resultKey = '';
    const seen = new Map();
    scene.dataset.type = actualId;
    const impactHost = document.getElementById('impact-stage'), liveGloveHost = document.getElementById('live-glove-stage');
    const bonusArtwork = document.getElementById('bonus-artwork');
    let impact = null, pendingImpact = null;
    const assetBase = prefix + (globalThis.__TIKMNG_CINEMATIC_BASE || '/widget/cinematic/');
    liveGloveHost.style.setProperty('--glove-atlas', 'url("' + new URL(assetBase + 'assets/pk-gloves-atlas.png', location.origin).href + '")');
    import(new URL(assetBase + 'pk-impact.js', location.origin).href).then(async module => {
        const instance = await module.createPKImpact(impactHost, { settings, preview });

    function launchImpact(note) {
        if (!preview && note.kind !== 'boost-start') return;
        pendingImpact = note;
        if (impact && note.expiresAt > Date.now() && enabled(note.kind)) impact.trigger({ id: [actualId, lastRoom, note.source, note.battleId, note.scope || '', note.id].join(':'),
            kind: note.kind, multiplier: note.data.multiplier, duration: note.expiresAt - Date.now(), hold: !preview });
    }

    function config(saved = {}) {
        const raw = { ...saved, ...draft }, result = { ...defaults };
        for (const key of ['showScores', 'showGlove', 'showMultiplier', 'showResults', 'showCountdown', 'showCompanions', 'sound'])
            if (raw[key] !== undefined) result[key] = [true, 1, '1', 'true'].includes(raw[key]);
        if (params.get('companions') === '0') result.showCompanions = false;
        if (/^#[0-9a-f]{6}$/i.test(raw.accent || '')) result.accent = raw.accent;
        for (const [key, min, max] of [['scale', 40, 180], ['opacity', 0, 100], ['offsetX', -1920, 1920],
            ['offsetY', -1080, 1080], ['duration', 1, 30], ['volume', 0, 100]]) result[key] = bound(raw[key], defaults[key], min, max);
        result.layout = raw.layout === 'arena' ? 'arena' : 'bar';
        result.profileLayout = ['split','corners','center','left','right'].includes(raw.profileLayout) ? raw.profileLayout : 'split';
        result.portraitStyle = ['auto','cloud','metal','floral'].includes(raw.portraitStyle) ? raw.portraitStyle : 'auto';
        result.theme = ['inferno','rose','botanical','platinum'].includes(raw.theme) ? raw.theme : defaults.theme;
        if (preview && ['inferno','rose','botanical','platinum'].includes(params.get('theme'))) result.theme = params.get('theme');
        const motifs=['flame','inferno','rose','botanical','floral','floral-rose','floral-lotus','platinum','crystal','rainbow','dragon','wolf','lion','serpent','butterfly','turtle','rabbit','gloves'];
        result.motif = motifs.includes(raw.motif) ? raw.motif
            : result.theme === 'botanical' ? 'floral' : result.theme === 'rose' ? 'rose' : result.theme === 'platinum' ? 'platinum' : 'flame';
        result.entrance = ['bottom','top','left','right','burst'].includes(raw.entrance) ? raw.entrance : 'bottom';
        result.notification = ['multiplier','glove','both'].includes(raw.notification) ? raw.notification : 'both';
        if (preview) {
            if (motifs.includes(params.get('motif'))) result.motif = params.get('motif');
            if (['bottom','top','left','right','burst'].includes(params.get('entrance'))) result.entrance = params.get('entrance');
            if (['multiplier','glove','both'].includes(params.get('notification'))) result.notification = params.get('notification');
            if (['split','corners','center','left','right'].includes(params.get('profileLayout'))) result.profileLayout = params.get('profileLayout');
            if (['auto','cloud','metal','floral'].includes(params.get('portraitStyle'))) result.portraitStyle = params.get('portraitStyle');
        }
        result.impactScale = bound(raw.impactScale, 100, 70, 140);
        result.quality = ['auto','high','low'].includes(raw.quality) ? raw.quality : 'auto';
        impact?.update(result); return result;
    }
    function imageURL(value) {
        if (typeof value !== 'string' || value.length > 2048 || !value) return '';
        try { const url = new URL(value, location.href), local = url.pathname.replace(/^\/overlays\/[A-Za-z0-9_-]{43}(?=\/)/, '');
            if (url.origin === location.origin && /^\/widget\/gift-assets\/[A-Za-z0-9_-]+\.(png|webp|jpe?g)$/.test(local)) return endpoint(local).href;
            return url.origin !== location.origin && url.protocol === 'https:' && !url.username && !url.password ? url.href : ''; } catch { return ''; }
    }
    function validStage(raw, now, legacy = false, fallback = null) {
        if (!object(raw) || !id(raw.battleId) || !Array.isArray(raw.players) || ![2, 4].includes(raw.players.length) ||

        const handle = value => String(value || '').trim().replace(/^@/, '').toLowerCase();

        bonusHost.style.transform = 'translate(calc(-50% + ' + settings.offsetX + 'px),calc(-50% + ' + settings.offsetY + 'px))';
        fitText();
    }
    function playSound(kind) {
        if (!settings.sound || !settings.volume || preview && !demo?.audition) return;
        try {
            const Audio = window.AudioContext || window.webkitAudioContext;
            if (!Audio) return;
            audio ||= new Audio(); const context = audio;
            Promise.resolve(context.resume()).then(() => {
                if (disposed || !settings.sound || preview && document.hidden) return;

                osc.frequency.exponentialRampToValueAtTime(kind === 'round-winner' ? 990 : 660, at + .15);
                gain.gain.setValueAtTime(settings.volume / 100 * .12, at); gain.gain.exponentialRampToValueAtTime(.001, at + .22);

    }

    async function poll() {
        clearTimeout(pollTimer); pollTimer = null;

        try {
            const response = await fetch(stateURL.href, { cache: 'no-store', signal: request.signal });

            const data = await response.json();
            if (!disposed && !request.signal.aborted) { failures = 0; accept(data); }

        }

        if (event.data.type === 'tikmng-widget-draft' && object(event.data.settings)) { draft = event.data.settings; settings = config(snapshot.studio?.settings?.[actualId]); impact?.update(settings); boardSignature = ''; render(); }
        if (event.data.type === 'tikmng-widget-audition') { startDemo('preview:' + Date.now(), 'preview', Date.now(), demo?.participants); demo.audition = true; clearStage(); render(); }
        if (event.data.type === 'tikmng-widget-pk-preview' && demo) {
            if ([2, 4].includes(event.data.participants)) { startDemo('preview:' + Date.now(), 'preview', Date.now(), event.data.participants); clearStage(); }
            const kinds = { glove: ['glove', { action: 'arrival', participantId: '111', evidence: 'manual' }],
                '2x': ['multiplier', { multiplier: 2 }], '3x': ['multiplier', { multiplier: 3 }] };
            const entry = Object.hasOwn(kinds, event.data.event) ? kinds[event.data.event] : null;
            if (entry) { const at = Date.now(), sequence = (demo.forcedSequence || 0) + 1; demo.forcedSequence = sequence;
                demo.forced = { id: 'manual:' + at + ':' + sequence, kind: entry[0], data: entry[1], occurredAt: at, expiresAt: at + settings.duration * 1000 }; current = null; queue = []; }
            render();
        }
    });

    });

        if (image.tagName !== 'IMG' || !image.closest('.portrait')) return;

    const localClock = setInterval(render, 250);
    addEventListener('pagehide', () => { disposed = true; pendingImpact = null; impact?.dispose(); clearInterval(localClock); clearTimeout(pollTimer); controller?.abort(); audio?.close().catch(() => {}); }, { once: true });
    render(); poll();
})();
