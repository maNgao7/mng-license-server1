<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fetih · Ordu Sıralaması</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: #fff2d5; font: 600 13px "Segoe UI", sans-serif; }
    main { width: min(426px, 100%); border: 1px solid #b79562; border-radius: 8px; background: #14222ef5; overflow: hidden; }
    h1 { font-size: 14px; color: #f1c777; margin: 0; padding: 9px 11px 6px; }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; }
    col.identity { width: 39%; }
    th, td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 5px 7px; text-align: right; font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { text-align: left; padding-left: 11px; }
    thead { color: #bdd1d9; font-size: 11px; }
    tbody tr { border-top: 1px solid #3e5360; }
    tbody tr:first-child { color: #ffdc96; background: #30434d; }
    p { margin: 0; padding: 2px 11px 9px; color: #bdd1d9; }
    @media (max-width: 325px) { th, td { padding-inline: 4px; font-size: 11px; } }
</style>
</head>
<body>
<main>
    <h1>Ordu Sıralaması</h1>
    <table aria-label="Fetih orduları" hidden>
        <colgroup><col class="identity"><col><col><col><col></colgroup>
        <thead><tr><th scope="col">Oyuncu</th><th scope="col">Asker</th><th scope="col">Tank</th><th scope="col" title="Helikopter">Heli</th><th scope="col">Jet</th></tr></thead>
        <tbody></tbody>
    </table>
    <p role="status">Ordular bekleniyor…</p>
</main>
<script>
    const table = document.querySelector('table');
    const rows = table.tBodies[0];
    const status = document.querySelector('[role=status]');
    const format = new Intl.NumberFormat('tr-TR');
    const stateUrl = new URL('../../api/widget/state', location.href);
    let revision = '';

    async function update() {
        try {
            stateUrl.search = new URLSearchParams({ type: 'fetih-ordular', revision });
            const response = await fetch(stateUrl, { cache: 'no-store', signal: AbortSignal.timeout(4500) });
            if (response.status === 204) return;
            if (!response.ok) throw new Error('Ordular okunamadı');
            const data = await response.json();
            const fragment = document.createDocumentFragment();
            for (const army of data.rows) {
                const row = document.createElement('tr');
                const name = row.insertCell();
                name.textContent = army.name;
                name.title = army.name;
                for (const unit of ['soldiers', 'tanks', 'helicopters', 'jets']) {
                    row.insertCell().textContent = format.format(army[unit]);
                }
                fragment.append(row);
            }
            rows.replaceChildren(fragment);
            status.textContent = 'Henüz ordu yok.';
            status.hidden = !(table.hidden = data.rows.length === 0);
            revision = data.revision;
        } catch {
            if (table.hidden) status.textContent = 'Ordular bekleniyor…';
        } finally {
            setTimeout(update, 3000);
        }
    }
    update();
</script>
</body>
</html>
