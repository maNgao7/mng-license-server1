<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Son Hediyeler</title><style>
:root{--accent:#25f4ee;--accent2:#fe2c55;--text:#fff;--muted:#bfd0dc}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text)}body{padding:10px}.shell{width:min(430px,100%);padding:13px;background:linear-gradient(145deg,rgba(5,12,23,.91),rgba(24,8,29,.82));border:1px solid color-mix(in srgb,var(--accent) 58%,transparent);border-radius:8px;box-shadow:0 18px 55px rgba(0,0,0,.45)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}h1{margin:0;font-size:16px;letter-spacing:0}h1 span{color:var(--accent)}.live{display:flex;align-items:center;gap:5px;color:#ff91a6;font-size:9px;font-weight:900}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent2);animation:pulse 1.2s infinite}.list{display:grid;gap:6px}.row{display:grid;grid-template-columns:38px minmax(0,1fr) 42px auto;align-items:center;gap:9px;min-height:50px;padding:6px 9px;border-left:3px solid var(--accent);background:linear-gradient(90deg,rgba(37,244,238,.09),rgba(255,255,255,.025));animation:enter .45s cubic-bezier(.2,.8,.2,1) both}.avatar,.fallback{width:36px;height:36px;border-radius:50%;object-fit:cover}.fallback{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:1000}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900}.gift-name{margin-top:2px;color:var(--muted);font-size:10px}.gift{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}.value{text-align:right;color:#ffe76a;font-size:12px;font-weight:1000}.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:12px}@keyframes enter{from{opacity:0;transform:translateX(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:scale(1.4);opacity:.55}}
</style></head><body><main class="shell"><header><h1>SON <span>HEDİYELER</span></h1><b class="live">CANLI</b></header><section class="list" id="list"><div class="empty">Hediye bekleniyor</div></section></main><script>
const overlayBase=location.pathname.match(/^\/overlays\/[A-Za-z0-9_-]{43}(?=\/)/)?.[0]||'';
function prefixURL(value){
 if(!overlayBase||typeof value!=='string'||!/^\/(?!\/)/.test(value)||/[\\\u0000-\u0020]/.test(value))return value;
 try{
  const url=new URL(value,location.origin),path=url.pathname.startsWith(overlayBase+'/')?url.pathname.slice(overlayBase.length):url.pathname;
  if(url.origin!==location.origin||!/^(?:\/(?:api\/)?widget\/(?:state|(?:top-gift|top-likes|leaderboard|activity)\/state)|\/widget\/(?:vendor\/matter\.js|physical-jar\.js)|\/widget\/gift-assets\/[A-Za-z0-9_-][A-Za-z0-9_.%-]*\.(?:png|gif|webp|jpe?g)|\/assets\/widgets\/glass-gift-jar\.png)$/.test(path))return value;
  url.searchParams.delete('key');
  return overlayBase+path+url.search+url.hash;
 }catch{return value}
}
function widgetImageURL(value){
 if(!overlayBase||typeof value!=='string')return value;
 if(value.startsWith('/'))return prefixURL(value);
 try{
  const url=new URL(value);
  if(!url.username&&!url.password&&/^https?:$/.test(url.protocol)&&(url.origin===location.origin||['127.0.0.1','localhost','[::1]'].includes(url.hostname))&&url.pathname.startsWith('/widget/gift-assets/')){const path=prefixURL(url.pathname+url.search+url.hash);if(path.startsWith(overlayBase+'/widget/gift-assets/'))return path}
 }catch{}
 return value;
}
const params=new URLSearchParams(location.search),accent=params.get('accent');if(accent&&/^#[0-9a-f]{6}$/i.test(accent))document.documentElement.style.setProperty('--accent',accent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('tr-TR');let signature='';
function render(entries){
 const gifts=entries.filter(e=>e.type==='gift').slice(0,Math.max(3,Math.min(8,Number(params.get('items'))||6))),next=JSON.stringify(gifts.map(e=>e.id));if(next===signature)return;signature=next;
 list.innerHTML=gifts.length?gifts.map((e,i)=>`<article class="row" style="animation-delay:${i*.04}s">${e.avatar?`<img class="avatar" src="${esc(widgetImageURL(e.avatar))}" alt="">`:`<span class="fallback">${esc((e.nickname||e.username||'?')[0].toLocaleUpperCase('tr-TR'))}</span>`}<div><div class="name">@${esc(e.username)}</div><div class="gift-name">${esc(e.giftName)} · x${fmt(e.count)}</div></div>${e.giftImage?`<img class="gift" src="${esc(widgetImageURL(e.giftImage))}" alt="">`:'<span></span>'}<b class="value">${fmt(e.coins)} coin</b></article>`).join(''):'<div class="empty">Hediye bekleniyor</div>';
}
async function update(){try{const q=new URLSearchParams({key:params.get('key')||'',channel:params.get('channel')||''});const r=await fetch(prefixURL(`/api/widget/activity/state?${q}`),{cache:'no-store'});if(r.ok)render((await r.json()).entries||[])}catch{}}
update();setInterval(update,900);
</script></body></html>
