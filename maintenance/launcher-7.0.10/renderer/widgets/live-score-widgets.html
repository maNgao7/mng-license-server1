<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikMnG Canli Skor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif;letter-spacing:0}#root{width:480px;max-width:100%;padding:12px;transform-origin:top left}header{display:flex;align-items:center;justify-content:space-between;padding:10px 6px;color:#f5ce70;font-size:20px;font-weight:800}header img{width:58px;height:32px;object-fit:contain}#rows{display:grid;gap:8px}.rank{height:80px;border:1px solid #5f6970;border-left:4px solid #73e4d0;background:#131a20f0;display:grid;grid-template-columns:28px 56px minmax(0,1fr) 78px;align-items:center;gap:10px;padding:8px 12px;border-radius:6px}.rank:first-child{border-color:#e6bd59;background:#211d13f0}.place{color:#e9ce90;font-size:19px;font-weight:bold}.avatar{width:56px;height:56px;border:2px solid #e9ce90;border-radius:50%;object-fit:cover;background:#293539}.identity{min-width:0}.name{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.handle{font-size:13px;color:#aebdc2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}.count{font-size:24px;text-align:right;color:#ffdc85;font-weight:800}.waiting{padding:18px;color:#c8d4d8;background:#131a20ed;font-size:16px;border-radius:4px}.pk #rows{grid-template-columns:repeat(2,minmax(0,1fr))}.pk{width:900px!important}.pk .rank{height:116px;grid-template-columns:56px minmax(0,1fr);border-left-color:#60cbdc}.pk .place{display:none}.pk .count{grid-column:2;font-size:30px;text-align:left}.pk .avatar{grid-row:1/3}.pk .handle{display:none}
.avatar{position:relative;display:grid;place-items:center;overflow:hidden;color:#f5ce70;font-size:24px}.avatar img{position:absolute;inset:0}.count{min-width:0;max-width:100%;white-space:nowrap;overflow:hidden}.rank{border-left-color:var(--accent,#73e4d0)}@media(max-width:500px){.pk .rank{padding:6px;gap:6px;grid-template-columns:40px minmax(0,1fr)}.pk .avatar{width:40px;height:40px}.pk .name{font-size:14px}}
.racon{position:absolute;top:0;left:50%;width:760px!important;max-width:none!important;height:660px;padding:12px!important;transform-origin:top center!important;isolation:isolate}
.racon header{height:56px;padding:0 12px;border-bottom:1px solid #a3b9b580;color:#f3e8d1;font-size:26px;text-shadow:0 2px 3px #0009}
.racon header img{width:66px;height:36px}.racon #rows{gap:12px;padding-top:12px}
.podium{position:relative;height:400px}.seat{position:absolute;top:130px;width:220px;height:244px;z-index:1}
.seat-1{top:0;left:calc(50% - 180px);width:360px;height:398px;z-index:2}.seat-2{right:0}.seat-3{left:0}
.seat-scale{width:360px;height:398px;transform:scale(.611111);transform-origin:top left}.seat-1 .seat-scale{transform:none}
.racon .racon-chair{position:relative;display:block;width:360px;height:398px;padding:0;border:0;background:transparent;box-shadow:none}
.chair-art{position:absolute;inset:0;width:360px;height:360px;pointer-events:none}
.racon .racon-chair .avatar{position:absolute;left:calc(49% - 76px);top:40px;width:152px;height:152px;z-index:2;border:0;box-shadow:none;font-size:56px;background:#132b29}
.racon .racon-chair .identity{position:absolute;left:84px;top:278px;width:190px;height:32px;display:grid;align-items:center;text-align:center;z-index:3}
.racon .name{font-size:22px;font-weight:700;color:#f7f4e9}.racon .racon-chair .name{font-size:24px}
.racon .racon-chair .handle{display:none}.racon .place{color:#e2c993;font-size:24px;font-weight:800}
.racon .racon-chair .place{position:absolute;top:14px;left:20px;min-width:38px;height:38px;display:grid;place-items:center;border:1px solid #a6bfba;border-radius:4px;background:#101c20f2;z-index:3;font-size:25px}
.racon .count{color:#ffe4a1;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #0009}
.racon .racon-chair .count{position:absolute;top:352px;left:70px;width:220px;height:42px;display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 12px;border:1px solid #93b2a8;border-radius:4px;background:#10201ff2;box-shadow:inset 0 0 0 2px #ffffff0b;font-size:30px}
.count b{min-width:0;overflow:hidden;white-space:nowrap}.chosen-gift{width:28px;height:28px;flex:0 0 28px;object-fit:contain}
.racon-tail{display:grid;gap:10px;margin:0 22px}.racon .racon-row{height:68px;grid-template-columns:34px minmax(0,1fr) 156px;gap:14px;padding:10px 22px;border:1px solid #758e89;border-left:4px solid var(--accent,#73e4d0);border-radius:4px;background:#111e20f2;box-shadow:inset 0 0 0 3px #ffffff08}
.racon .racon-row .identity{min-width:0}.racon .racon-row .count{font-size:27px}.racon .waiting{margin-top:8px;text-align:center}
.chair-glint{position:absolute;left:30px;top:0;width:300px;height:320px;pointer-events:none;opacity:0;animation:chair-light 5s ease-in-out infinite}
.chair-glint::before,.chair-glint::after{content:'';position:absolute;top:27px;left:143px;width:2px;height:16px;background:#fff4cf;box-shadow:0 0 7px #d9ffe8}.chair-glint::after{transform:rotate(90deg)}
.seat-2 .chair-glint{animation-delay:1.2s}.seat-3 .chair-glint{animation-delay:2.4s}.no-light .chair-glint{display:none}.no-animation *{animation:none!important}
.rank.rank-arrived{animation:rank-arrival .45s ease-out both}.racon-chair.rank-arrived{animation:chair-arrival .5s ease-out both}
@keyframes chair-light{0%,25%,100%{opacity:0}45%,60%{opacity:.85}}@keyframes rank-arrival{from{opacity:.2;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}@keyframes chair-arrival{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pk.team-view #rows{display:block}.pk-match{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid #8da6ad66;border-radius:6px;background:#0d1519ed;overflow:hidden;box-shadow:0 4px 16px #0004}.pk-match::before,.pk-match::after{content:'';position:absolute;top:0;height:3px;width:50%;background:#4cdeeb}.pk-match::before{left:0}.pk-match::after{right:0;background:#ff648e}.match-vs{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:32px;height:24px;font-size:11px;font-weight:800;color:#e3c882;background:#10191e;z-index:1}.pk-team{--team-color:#4cdeeb;min-width:0;padding:18px 24px 12px}.pk-team.left-team{border-right:1px solid #8da6ad30}.pk-team.right-team{--team-color:#ff648e}.team-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--team-color)}.team-state{min-width:65px;text-align:right;font-size:11px;color:#b9cbd1}.right-team .team-heading{flex-direction:row-reverse}.right-team .team-state{text-align:left}.pk-total{display:flex;align-items:center;justify-content:center;min-width:0;width:100%;height:64px;margin:8px 0 18px;font-size:48px;line-height:64px;text-align:center;color:#fff;font-variant-numeric:tabular-nums}.pk-team[data-leading="true"] .pk-total{color:var(--team-color)}.team-members{display:grid;gap:12px}.team-member{min-width:0;display:flex;gap:12px;align-items:center;height:48px}.team-member .avatar{flex:0 0 46px;width:46px;height:46px;border-color:var(--team-color);font-size:20px;box-shadow:0 0 0 3px #ffffff09}.team-member .name{font-size:16px;font-weight:700}.right-team .team-member{flex-direction:row-reverse;text-align:right}.pk-balance{display:flex;grid-column:1/-1;height:7px;margin:12px 20px 18px;background:#3a4950;border-radius:3px;overflow:hidden}.pk-balance span{height:100%;transition:width .35s ease;background:#4cdeeb}.pk-balance span+span{background:#ff648e}.team-view .waiting{grid-column:1/-1}@media(max-width:500px){.pk-team{padding:14px 12px 8px}.team-heading{font-size:11px}.team-state{min-width:0;font-size:9px}.match-vs{top:14px;width:22px;font-size:9px}.team-member{gap:8px;height:40px}.team-member .avatar{flex-basis:34px;width:34px;height:34px}.team-member .name{font-size:12px}.pk-total{height:56px;line-height:56px;margin-bottom:12px}.pk-balance{margin:12px 12px 14px;height:6px}}
.racon{background:transparent}.racon header{border-color:#bda36a55;color:#ffe2a0}.racon .podium{height:444px}
.racon .seat-1{height:444px}.racon .seat-scale,.racon .racon-chair{height:440px}
.racon .chair-art{z-index:2}
.racon .racon-chair .avatar{left:22.3%;top:79.2px;width:55.4%;height:194.4px;z-index:1;border:0;background:#14171c}
.racon .racon-chair .identity{left:24px;top:361px;width:312px;height:33px}
.racon .racon-chair .count{top:398px;left:70px;border-color:#c2a469;background:#111111e8}
.racon .racon-row{height:54px;background:#101010eb;border-color:#aa8d505e;border-left-color:#d0ad64}
.racon .chair-glint{z-index:3}
.pk-team .team-heading{font-size:15px}.team-member .avatar{flex-basis:54px;width:54px;height:54px}.team-member{height:58px}.team-member .name{font-size:18px}.pk-total::after{content:'PUAN';font-size:11px;line-height:1.3;margin-left:8px;align-self:center;color:#c5d3dc}
.pk-description{margin:0 0 12px;color:#b9cbd1;font-size:13px;text-align:center;line-height:1.5}
@media(max-width:500px){.team-member .avatar{flex-basis:38px;width:38px;height:38px}.team-member .name{font-size:13px}.pk-team .team-heading{font-size:11px}}
</style>
<main id="root"><header><span id="title">RACONA GİRENLER</span><img alt="TikMnG"></header><div id="pk-context" class="pk-description" hidden></div><div id="rows"></div></main>
<script>
'use strict';
const params=new URLSearchParams(location.search),type=params.get('type')==='pk'?'pk':'raconlist',preview=params.get('preview')==='1',root=document.getElementById('root'),host=document.getElementById('rows');
const prefix=location.pathname.match(/^\/overlays\/[^/]+/)?.[0]||'';
const endpoint=path=>{const u=new URL(prefix+path,location.origin);for(const key of ['key','channel'])if(params.has(key))u.searchParams.set(key,params.get(key));return u;};
const url=endpoint('/api/widget/state');url.searchParams.set('type',type);
document.querySelector('header img').src=endpoint('/widget/gift-assets/logo-v3.png').href;
let timer,disposed=false,draft={},last=null,signature='',options={};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=value=>{if(typeof value!=='string'||!value)return '';try{const u=new URL(value,location.href),p=u.pathname.replace(/^\/overlays\/[^/]+/,'');if(/^\/widget\/gift-assets\/[A-Za-z0-9_-]+\.(png|webp|jpe?g)$/.test(p))return endpoint(p).href;return u.protocol==='https:'&&!u.username&&!u.password?u.href:'';}catch{return '';}};
function raconHTML(rows,studio,config){
if(!rows.length)return `<div class="waiting">${config.giftId?'Seçilen hediyeyi gönderenler burada görünecek':'Sıralama hediyesi seçilmedi'}</div>`;
const art=endpoint('/widget/gift-assets/frame-imperial-v1.webp').href;
const gift=/^\d{1,12}$/.test(config.giftId||'')?endpoint('/widget/gift-assets/'+config.giftId+'.png').href:'';
function entry(row,i,chair){
const known=(studio.raconRanking||[]).find(r=>r.username===row.username)||row;
const username=row.username||known.username||'',name=username?'@'+username:row.nickname||known.nickname||'İzleyici',src=image(known.avatar),person=String(username||row.id||i);
const stable=JSON.stringify([chair,name,src,gift]);
return `<article class="rank ${chair?'racon-chair':'racon-row'}" data-person="${esc(person)}" data-static="${esc(stable)}" data-rank="${i+1}">${chair?`<img class="chair-art" src="${esc(art)}" alt=""><i class="chair-glint" aria-hidden="true"></i>`:''}<span class="place">${i+1}</span>${chair?`<span class="avatar">${esc(name.replace(/^@/,'').slice(0,1).toLocaleUpperCase('tr'))}${src?`<img src="${esc(src)}" alt="${esc(name)}" referrerpolicy="no-referrer" onerror="this.remove()" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:''}</span>`:''}<div class="identity"><div class="name" title="${esc(name)}">${esc(name)}</div></div><span class="count">${chair&&gift?`<img class="chosen-gift" src="${esc(gift)}" alt="Seçilen hediye">`:''}<b>${Math.max(0,Number(row.count)||0).toLocaleString('tr')}X</b></span></article>`;
}
return '<section class="podium" aria-label="İlk üç">'+rows.slice(0,3).map((row,i)=>`<div class="seat seat-${i+1}"><div class="seat-scale">${entry(row,i,true)}</div></div>`).join('')+'</section>'+(rows.length>3?'<section class="racon-tail" aria-label="Diğer katılımcılar">'+rows.slice(3).map((row,i)=>entry(row,i+3,false)).join('')+'</section>':'');
}
function reconcileRacon(fragment){
const oldEntries=new Map([...host.querySelectorAll('[data-person]')].map(n=>[n.dataset.person,n]));
for(const node of [...fragment.querySelectorAll('[data-person]')]){
const old=oldEntries.get(node.dataset.person);
if(old&&old.dataset.static===node.dataset.static){old.dataset.rank=node.dataset.rank;old.querySelector('.place').textContent=node.querySelector('.place').textContent;old.querySelector('.count b').textContent=node.querySelector('.count b').textContent;node.replaceWith(old);}
else node.classList.add('rank-arrived');
}
host.replaceChildren(fragment);
}
function pkTeamHTML(pk,rows,config){
let teams=Array.isArray(pk?.teams)?pk.teams:[];
if(rows.length!==2&&rows.length!==4||teams.length!==2)return '<div class="waiting">'+(rows.length===4?'PK takım bilgisi bekleniyor':'PK verisi bekleniyor')+'</div>';
teams=[...teams];if(config.swapSides)teams.reverse();
const total=teams[0].score+teams[1].score,share=total?teams[0].score/total*100:50;
const roster=JSON.stringify(teams.map(team=>[team.id,team.memberIds.map(id=>{const p=rows.find(p=>p.id===id)||{};return [id,p.nickname,p.username,p.avatar];})]));
return `<div class="pk-match" data-roster="${esc(roster)}"><span class="match-vs">VS</span>`+teams.map((team,i)=>{const members=team.memberIds.map(id=>rows.find(row=>row.id===id)).filter(Boolean),leading=team.score>teams[1-i].score;return `<section class="pk-team ${i?'right-team':'left-team'}" data-team="${esc(team.id)}" data-leading="${leading}"><div class="team-heading"><span>${i?'SAĞ TAKIM':'SOL TAKIM'}</span><span class="team-state">${leading?(pk.status==='finished'?'KAZANDI':'ÖNDE'):''}</span></div><b class="count pk-total">${Number(team.score).toLocaleString('tr')}</b><div class="team-members">${members.map((row,j)=>{const name=row.nickname||row.username||'Yayıncı '+(i*2+j+1),src=image(row.avatar);return `<div class="team-member" data-person="${esc(row.id)}"><span class="avatar">${esc(name.slice(0,1).toLocaleUpperCase('tr'))}${src?`<img src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:''}</span><div class="identity"><div class="name" title="${esc(name)}">${esc(name)}</div></div></div>`;}).join('')}</div></section>`;}).join('')+`<div class="pk-balance" aria-hidden="true"><span style="width:${share}%"></span><span style="width:${100-share}%"></span></div></div>`;
}
function paint(data){last=data;const studio=data.studio||{},config={...studio.settings?.[type],...draft};options=config;root.classList.toggle('pk',type==='pk');root.classList.toggle('racon',type==='raconlist');root.classList.toggle('no-light',config.lighting===false);root.classList.toggle('no-animation',config.animation===false);document.getElementById('title').textContent=type==='pk'?'CANLI PK':'RACONA GİRENLER';root.style.opacity=String(Math.max(.1,Math.min(1,(Number(config.opacity)||100)/100)));fitRoot();
const context=document.getElementById('pk-context');context.hidden=type!=='pk';if(type==='pk'){
    const pk=studio.pk,remaining=pk?.endsAt?Math.max(0,Math.ceil((pk.endsAt-Date.now())/1000)):null;
    const clock=remaining===null?'':String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
    context.textContent=pk?[(pk.players?.length===4?'2 × 2':'1 × 1'),pk.status==='finished'?'PK sona erdi':pk.status==='waiting'?'Başlaması bekleniyor':'Canlı PK',clock].filter(Boolean).join(' · '):'Aktif PK bağlantısı bekleniyor';
}
let rows=type==='pk'?(studio.pk?.players||[]):(preview&&Array.isArray(draft.rankingRows)?draft.rankingRows:studio.raconRanking||[]);
if(type==='pk'&&config.players&&config.players!=='auto'&&Number(config.players)!==rows.length)rows=[];
if(preview&&type!=='pk'&&!rows.length){const tests=studio.tests?.[type];if(tests?.expiresAt>Date.now())rows=(tests.events||[]).slice(-5).map(e=>({...e,count:e.count||1}));}
rows=[...rows].sort((a,b)=>type==='pk'?0:b.count-a.count).slice(0,type==='pk'?4:Number(config.items)||5);
const html=type==='raconlist'?raconHTML(rows,studio,config):rows.length?rows.map((row,i)=>{const src=image(row.avatar),name=row.nickname||row.username||'Yayıncı '+(i+1);return `<article class="rank" data-person="${esc(row.username||row.id||i)}"><span class="place">${i+1}</span><span class="avatar">${esc(name.slice(0,1).toLocaleUpperCase('tr'))}${src?`<img src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:''}</span><div class="identity"><div class="name" title="${esc(name)}">${esc(name)}</div><div class="handle">${row.username?'@'+esc(row.username):''}</div></div><span class="count"><b>${Number(row.score).toLocaleString('tr')}</b></span></article>`;}).join(''):'<div class="waiting">PK verisi bekleniyor</div>';
const teamView=type==='pk'&&config.layout!=='players',markup=teamView?pkTeamHTML(studio.pk,rows,config):html;root.classList.toggle('team-view',teamView);
if(markup!==signature){const template=document.createElement('template');template.innerHTML=markup;const oldMatch=host.querySelector('.pk-match'),newMatch=template.content.querySelector('.pk-match');if(type==='raconlist')reconcileRacon(template.content);else if(oldMatch&&newMatch&&oldMatch.dataset.roster===newMatch.dataset.roster){for(const node of newMatch.querySelectorAll('.pk-team')){const old=[...oldMatch.querySelectorAll('.pk-team')].find(t=>t.dataset.team===node.dataset.team);old.dataset.leading=node.dataset.leading;old.querySelector('.pk-total').textContent=node.querySelector('.pk-total').textContent;old.querySelector('.team-state').textContent=node.querySelector('.team-state').textContent;}oldMatch.querySelectorAll('.pk-balance span').forEach((n,i)=>{n.style.width=newMatch.querySelectorAll('.pk-balance span')[i].style.width;});}else{const existing=new Map([...host.children].map(node=>[node.dataset.person||node.dataset.team,node]));const next=[...template.content.children].map(node=>{const old=existing.get(node.dataset.person||node.dataset.team);if(old&&old.outerHTML.replace(' rank-arrived','')===node.outerHTML)return old;node.classList.add('rank-arrived');return node;});host.replaceChildren(...next);}signature=markup;}root.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(config.accent||'')?config.accent:'#73e4d0');fitCounts();}
function fitCounts(){for(const node of host.querySelectorAll('.count')){let size=node.classList.contains('pk-total')?48:type==='pk'?30:node.closest('.racon-chair')?30:27;const text=node.querySelector('b')||node;text.style.fontSize=size+'px';while(size>8&&text.scrollWidth>text.clientWidth){text.style.fontSize=--size+'px';}}if(type==='raconlist')for(const node of host.querySelectorAll('.name')){let size=node.closest('.racon-chair')?24:22;node.style.fontSize=size+'px';while(size>10&&node.scrollWidth>node.clientWidth)node.style.fontSize=--size+'px';}}
function fitRoot(){const scale=Math.max(.4,Math.min(1.8,(Number(options.scale)||100)/100)),fit=type==='raconlist'?Math.min(1,innerWidth/760,innerHeight/660):1;root.style.transform=`translate(${Number(options.offsetX)||0}px,${Number(options.offsetY)||0}px) ${type==='raconlist'?'translateX(-50%) ':''}scale(${scale*fit})`;}
window.addEventListener('resize',()=>{fitRoot();fitCounts();});
async function poll(){try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('state');paint(await response.json());}catch{}finally{if(!disposed)timer=setTimeout(poll,preview&&document.hidden?10000:1000);}}
window.addEventListener('message',event=>{if(!preview||event.origin!==location.origin||event.source!==parent||event.data?.type!=='tikmng-widget-draft')return;draft=event.data.settings||{};if(last)paint(last);});window.addEventListener('pagehide',()=>{disposed=true;clearTimeout(timer);},{once:true});poll();
</script></html>
